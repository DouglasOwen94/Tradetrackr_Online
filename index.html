function moneyParts(n){
  const neg = n < 0; const abs = Math.abs(n);
  const [w, c] = abs.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}).split('.');
  return { main:(neg?'-':'') + '$' + w, cents:'.' + c };
}
const tradePnl = t => t.layers.reduce((s,x)=>s+x,0);
function balance(accountId, uptoDate){
  const a = acct(accountId); if(!a) return 0;
  let b = a.startingBalance || 0;
  for(const t of S.trades) if(t.accountId===accountId && (!uptoDate || t.date <= uptoDate)) b += tradePnl(t);
  for(const x of S.txns) if(x.accountId===accountId && (!uptoDate || x.date <= uptoDate)) b += x.amount;
  return b;
}
const inMonth = (dateStr,y,m) => { const [Y,M] = dateStr.split('-').map(Number); return Y===y && M-1===m; };
function monthTrades(accountId,y,m){ return S.trades.filter(t=>t.accountId===accountId && inMonth(t.date,y,m)); }
function classify(t){ const p = tradePnl(t); const thr = Math.abs(S.settings.beThreshold||0); return p>thr?'win':p<-thr?'loss':'be'; }
function fmtDateShort(d){ const [y,m,dd]=d.split('-'); return Number(dd)+' '+MONTHS_S[m-1].charAt(0)+MONTHS_S[m-1].slice(1).toLowerCase()+' '+y; }
function relDay(d){
  const t = todayISO();
  if(d===t) return 'Today';
  const y = new Date(); y.setDate(y.getDate()-1);
  const yISO = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  if(d===yISO) return 'Yesterday';
  return fmtDateShort(d);
}

/* ============================================================
   RENDER: CALENDAR
   ============================================================ */
function kfmt(n){
  const a = Math.abs(n);
  let s;
  if(a >= 99950) s = (a/1000).toFixed(0)+'k';
  else if(a >= 999.5) s = (a/1000).toFixed(1).replace(/\.0$/,'')+'k';
  else s = a.toFixed(a>=100?0:a%1?1:0).replace(/\.0$/,'');
  return (n<0?'-':n>0?'+':'')+'$'+s;
}
function renderCalendar(){
  const el = document.getElementById('view-calendar');
  if(!S.accounts.length){ el.innerHTML = emptyOnboard(); return; }
  if(!UI.statsAccountId || !acct(UI.statsAccountId)) UI.statsAccountId = defAcct().id;
  const aid = UI.statsAccountId;
  const y = UI.statsY, m = UI.statsM;
  const isCurrent = y===now.getFullYear() && m===now.getMonth();
  const tISO = todayISO();

  /* daily aggregates */
  const days = {};
  for(const t of S.trades){
    if(t.accountId!==aid || !inMonth(t.date,y,m)) continue;
    const d = +t.date.split('-')[2];
    (days[d] = days[d] || {pnl:0,n:0});
    days[d].pnl += tradePnl(t); days[d].n++; if(classify(t)==='win') days[d].w = (days[d].w||0)+1;
  }
  const monthPnl = Object.values(days).reduce((s,d)=>s+d.pnl,0);
  const monthN = Object.values(days).reduce((s,d)=>s+d.n,0);
  /* missed trades: marked on the day, never added to PnL */
  const mdays = {};
  for(const t of S.missed){
    if(t.accountId!==aid || !inMonth(t.date,y,m)) continue;
    const d = +t.date.split('-')[2];
    (mdays[d] = mdays[d] || {n:0}).n++;
  }
  const missedMonth = Object.values(mdays).reduce((s,d)=>s+d.n,0);
  const wide = isWide();
  const dayMax = Math.max(1, ...Object.values(days).map(v=>Math.abs(v.pnl)));
  const weeksArr = []; let wStart = 1;
  const monthPlans = (S.plans||[]).filter(p=>inMonth(p.date,y,m)).length;

  const daysInMonth = new Date(y, m+1, 0).getDate();
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7; /* Monday = 0 */

  let cells = ['Mo','Tu','We','Th','Fr','Sa','Su'].map((h,i)=>`<div class="cal-h ${i>4?'wknd':''}">${h}</div>`).join('') + `<div class="cal-h">WEEK</div>`;
  let week = {pnl:0,n:0}, weekNo = 1, col = 0;
  for(let i=0;i<firstDow;i++){ cells += `<div class="cal-cell blank"></div>`; col++; }
  for(let d=1; d<=daysInMonth; d++){
    const dd = days[d], md = mdays[d];
    const iso = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = iso===tISO;
    if(col===0) wStart = d;
    const pl = planFor(iso), pcls = pl ? ' has-plan' : '', pg = pl && pl.review && pl.review.grade ? `<span class="pg g-${esc(pl.review.grade)}">${esc(pl.review.grade)}</span>` : '';
    const mk = md ? `<span class="mk" aria-label="${md.n} log${md.n===1?'':'s'}">${md.n}</span>` : '';
    if(dd){
      week.pnl += dd.pnl; week.n += dd.n; week.w = (week.w||0) + (dd.w||0);
      const thr = Math.abs(S.settings.beThreshold||0);
      const kind = dd.pnl>thr?'pos':dd.pnl<-thr?'neg':'flat';
      cells += `<button class="cal-cell ${kind} ${isToday?'today':''}${pcls}" data-day="${iso}" style="--a:${(Math.abs(dd.pnl)/dayMax).toFixed(2)}">
        <span class="d">${d}</span><span class="p">${kfmt(dd.pnl)}</span><span class="c">${dd.n} trade${dd.n===1?'':'s'}</span>${mk}${pg}
      </button>`;
    } else if(md){
      cells += `<button class="cal-cell missed-only ${isToday?'today':''}${pcls}" data-day="${iso}">
        <span class="d">${d}</span><span class="p" style="color:var(--gold-1)">—</span><span class="c">${md.n} log${md.n===1?'':'s'}</span>${pg}
      </button>`;
    } else {
      cells += pl ? `<button class="cal-cell plan-only ${isToday?'today':''}${pcls}" data-day="${iso}"><span class="d">${d}</span><span class="p">${I_SUN}</span><span class="c">Plan</span>${pg}</button>`
                  : `<div class="cal-cell ${isToday?'today':''}"><span class="d">${d}</span></div>`;
    }
    col++;
    if(col===7 || d===daysInMonth){
      while(col<7){ cells += `<div class="cal-cell blank"></div>`; col++; }
      const wk = week.n
        ? `<div class="cal-week"><span class="d">W${weekNo}</span><span class="p ${week.pnl>Math.abs(S.settings.beThreshold||0)?'pos':week.pnl<-Math.abs(S.settings.beThreshold||0)?'neg':''}">${kfmt(week.pnl)}</span><span class="c">${week.n} trade${week.n===1?'':'s'}</span></div>`
        : `<div class="cal-week"><span class="d">W${weekNo}</span><span class="p" style="color:var(--ink-faint)">—</span></div>`;
      cells += wk;
      weeksArr.push({no:weekNo, pnl:week.pnl, n:week.n, w:week.w||0, from:wStart, to:d});
      week = {pnl:0,n:0}; weekNo++; col = 0;
    }
  }

  const head = `
  <div class="page-head">
    <div><h2>Calendar</h2><p>Every trading day at a glance</p></div>
    ${S.accounts.length>1?`<div class="acct-select" style="--_:0">
      <select id="cal-acct" aria-label="Select account">
        ${S.accounts.map(a=>`<option value="${a.id}" ${a.id===aid?'selected':''}>${esc(a.name)}</option>`).join('')}
      </select>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>`:`<span class="ph-acct">${esc(acct(aid).name)}</span>`}
  </div>`;
  const monthRow = `
  <div class="month-row">
    <button class="m-btn" id="cal-prev" aria-label="Previous month">${I.chevL}</button>
    <span class="m-label">${MONTHS[m]} ${y}</span>
    <button class="m-btn" id="cal-next" aria-label="Next month" ${isCurrent?'disabled':''}>${I.chevR}</button>
  </div>`;
  const lab = s => `<div style="font-size:.68rem;color:var(--ink-dim)">${s}</div>`;
  const summary = `
  <div class="card-navy" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div>${lab('Monthly PnL')}
    <div class="cal-sum" style="font-size:1.25rem;font-weight:600;color:${monthPnl>0?'var(--green)':monthPnl<0?'var(--red)':'var(--ink)'}">${money(monthPnl,true)}</div></div>
    <div style="text-align:center">${lab('Trades')}
    <div class="cal-sum" style="font-size:1.25rem;font-weight:600">${monthN}</div></div>
    <div style="text-align:right">${lab('Logs')}
    <div class="cal-sum" style="font-size:1.25rem;font-weight:600;color:${missedMonth?'var(--gold-1)':'var(--ink-faint)'}">${missedMonth}</div></div>
  </div>`;
  /* wide screens: a few more numbers beside the calendar */
  let extra = '';
  if(wide){
    const dvals = Object.entries(days).map(([d,v])=>({d:+d, pnl:v.pnl}));
    const best = dvals.length ? dvals.reduce((a,b)=> b.pnl>a.pnl?b:a) : null;
    const worst = dvals.length ? dvals.reduce((a,b)=> b.pnl<a.pnl?b:a) : null;
    const mt = monthTrades(aid,y,m);
    const wr = mt.length ? Math.round(mt.filter(t=>classify(t)==='win').length/mt.length*100) : null;
    const row = (k,v,c) => `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:.82rem"><span style="color:var(--ink-dim)">${k}</span><b class="cal-sum" style="color:${c||'var(--ink)'}">${v}</b></div>`;
    extra = `<div class="card-navy" style="padding:8px 16px 10px">
      ${row('Win rate', wr===null?'—':wr+'%')}
      ${row('Days traded', dvals.length)}
      ${row('Best day', best ? best.d+' '+MONTHS_S[m].charAt(0)+MONTHS_S[m].slice(1).toLowerCase()+' · '+money(best.pnl,true) : '—', best&&best.pnl>0?'var(--green)':null)}
      ${row('Worst day', worst ? worst.d+' '+MONTHS_S[m].charAt(0)+MONTHS_S[m].slice(1).toLowerCase()+' · '+money(worst.pnl,true) : '—', worst&&worst.pnl<0?'var(--red)':null)}
    </div>`;
  }
  const heatKey = monthN ? `<span class="heat-key">Smaller day<i style="--a:.15"></i><i style="--a:.45"></i><i style="--a:.75"></i><i style="--a:1"></i>Bigger day</span>` : '';
  const legend = (missedMonth || monthN || monthPlans) ? `<div class="cal-legend">${heatKey}${monthPlans ? '<span><i class="lg-plan"></i>Morning plan</span>' : ''}${missedMonth ? `<span><i style="border:1px dashed var(--gold-1)"></i>${wide?'':'<i style="width:7px;height:7px;border-radius:50%;background:var(--gold-1)"></i>'}Log (not counted)</span>` : ''}</div>` : '';
  const hint = (monthN||missedMonth) ? `<p style="font-size:.72rem;color:var(--ink-dark-dim);margin:10px 4px 0;text-align:center">${wide?'Click':'Tap'} a day to review it.</p>` : '';
  const coach = coachCardHTML(!wide);
  /* month at a glance: line, weeks, green vs red days */
  const dv = Object.values(days), gd = dv.filter(v=>v.pnl>Math.abs(S.settings.beThreshold||0)), rd = dv.filter(v=>v.pnl<-Math.abs(S.settings.beThreshold||0)), fd = dv.length-gd.length-rd.length;
  const avgG = gd.length ? gd.reduce((s,v)=>s+v.pnl,0)/gd.length : 0, avgR = rd.length ? rd.reduce((s,v)=>s+v.pnl,0)/rd.length : 0;
  const mS = monT(m);
  const glance = monthN ? `
  <div class="card-navy chart-card">
    <div class="card-title"><h3>Month to date</h3><span class="sub">${MONTHS[m]} ${y}</span></div>
    <div class="chart-wrap" data-chart="calcum"></div>
  </div>
  <div class="card-navy">
    <div class="card-title"><h3>Green vs red days</h3><span class="sub">${dv.length} day${dv.length===1?'':'s'} traded</span></div>
    <div class="segbar tall">${gd.length?`<i style="flex:${gd.length};background:var(--green)"></i>`:''}${rd.length?`<i style="flex:${rd.length};background:var(--red)"></i>`:''}${fd?`<i style="flex:${fd};background:var(--ink-faint)"></i>`:''}</div>
    <div class="daysplit">
      <div><span><i style="background:var(--green)"></i>${gd.length} green</span><b class="cal-sum" style="color:var(--green)">${gd.length?kfmt(avgG):'—'}</b><small>avg green day</small></div>
      <div><span><i style="background:var(--red)"></i>${rd.length} red</span><b class="cal-sum" style="color:var(--red)">${rd.length?kfmt(avgR):'—'}</b><small>avg red day</small></div>
    </div>
  </div>
  <div class="card-navy">
    <div class="card-title"><h3>By week</h3><span class="sub">trades · win rate</span></div>
    ${hbarsHTML(weeksArr.filter(w=>!(isCurrent && w.from > now.getDate())).map(w=>({label:'W'+w.no, full:'Week '+w.no+' · '+w.from+'–'+w.to+' '+mS, sub: w.n ? w.from+'–'+w.to+' '+mS : 'no trades', pnl:w.pnl, n:w.n, w:w.w})))}
  </div>` : '';
  el.innerHTML = head + (wide
    ? `<div class="cal-layout"><div>${monthRow}<div class="cal-grid">${cells}</div>${legend}${hint}</div><div class="cal-side">${openStripHTML()}${isCurrent ? planStripHTML() : ''}${coach}${summary}${extra}${glance}</div></div>`
    : openStripHTML() + (isCurrent ? planStripHTML() : '') + coach + monthRow + summary + `<div class="cal-grid">${cells}</div>` + legend + hint + `<div class="cal-glance">${glance}</div>`);
  fillCharts(el, {aid, y, m});
  const cm = el.querySelector('#coach-more'); if(cm) cm.onclick = openBriefsSheet;
  wirePlanStrip(el);
  wireOpen(el);

  const calSel = el.querySelector('#cal-acct');
  if(calSel) calSel.onchange = e => { UI.statsAccountId = e.target.value; renderCalendar(); };
  el.querySelector('#cal-prev').onclick = () => { UI.statsM--; if(UI.statsM<0){UI.statsM=11;UI.statsY--;} renderCalendar(); };
  const nx = el.querySelector('#cal-next'); if(nx) nx.onclick = () => { UI.statsM++; if(UI.statsM>11){UI.statsM=0;UI.statsY++;} renderCalendar(); };
  el.querySelectorAll('[data-day]').forEach(b=> b.onclick = ()=> openDaySheet(b.dataset.day));
}

function openDaySheet(iso, opts){
  const aid = UI.statsAccountId;
  const trades = S.trades.filter(t=>t.accountId===aid && t.date===iso).sort((a,b)=>whenTs(b)-whenTs(a));
  const missedList = S.missed.filter(t=>t.accountId===aid && t.date===iso).sort((a,b)=>whenTs(b)-whenTs(a));
  const dayPnl = trades.reduce((s,t)=>s+tradePnl(t),0);
  const pl = planFor(iso);
  openSheet(`
    <h3>${relDay(iso)}</h3>
    <p class="desc">${trades.length ? `${trades.length} trade${trades.length===1?'':'s'} · Day PnL <b style="color:${dayPnl>0?'var(--green-deep)':dayPnl<0?'var(--red-deep)':'inherit'}">${money(dayPnl,true)}</b>` : 'No trades taken'}${missedList.length ? ' · '+missedList.length+' log'+(missedList.length===1?'':'s') : ''}</p>
    ${pl ? `<div class="plan-card"><div class="pc-head">${I_SUN}<b>Morning plan</b><span class="pc-sum">${esc(planSummary(pl))}</span></div>${planBodyHTML(pl)}<div class="row-btns" style="margin-top:12px"><button class="btn-soft" data-plan-edit>${I.pencil}Edit plan</button><button class="btn-soft ${pl.review?'':'gold'}" data-plan-review>${pl.review?'Edit check':'End-of-day check'}</button></div></div>` : (iso<=todaySGT() ? `<button class="plan-add" data-plan-edit>${I_SUN}<span>Add a morning plan for this day</span>${I.chevR}</button>` : '')}
    <div>
    ${trades.map(t=> tradeRowHTML(t, t.layers.length>1 ? t.layers.length+' layers' : '')).join('')}
    ${missedList.length ? `<div class="sub-head"><span>Logs</span><span style="color:var(--ink-faint)">not counted</span></div>${missedList.map(t=>tradeRowHTML(t,'')).join('')}` : ''}
    </div>
  `, opts);
  const pe = sheetEl.querySelector('[data-plan-edit]'); if(pe) pe.onclick = ()=> closeSheet(()=> openPlanEditor(iso));
  const pr = sheetEl.querySelector('[data-plan-review]'); if(pr) pr.onclick = ()=> closeSheet(()=> openPlanReview(iso));

  const li = (arr, ordered) => `<${ordered?'ol':'ul'} class="coach-list">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</${ordered?'ol':'ul'}>`;

        ${url ? `<a class="coach-link" href="${esc(url)}" target="_blank" rel="noopener">Open the full review ↗</a>` : ''}`;

/* ============================================================
   MORNING PLAN — one per day: what you're watching, no bias.
   { id, date, assets[], levels, news, scenarios[{if,then}], checklist[{text,done}],
     notes, images[], review:{respected,followed,grade,note,at}|null, createdAt, updatedAt }
   ============================================================ */
const planFor = d => (S.plans||[]).filter(p=>p && p.date===d).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0] || null;
const DEFAULT_PLAN_RULES = ['Levels marked on the chart','News times checked','Coach focus read'];
const PLAN_DRAFT_KEY = 'tt_plan_draft';
const REVIEW_Q = [
  ['respected', 'Did price respect your levels?', [['yes','Yes'],['partly','Partly'],['no','No']]],
  ['followed',  'Did you trade your plan?',       [['yes','Yes'],['partly','Partly'],['no','No'],['none','No trades']]],
  ['grade',     'Grade the day',                  [['A','A'],['B','B'],['C','C']]]
];
const reviewLabel = (k, v) => { const q = REVIEW_Q.find(x=>x[0]===k); const o = q && q[2].find(x=>x[0]===v); return o ? o[1] : '—'; };
const I_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function blankPlan(date){
  const b = latestBrief(), focus = b && b.focus && typeof b.focus.text==='string' ? b.focus.text.trim() : '';
  const rules = [...(S.settings.planRules||DEFAULT_PLAN_RULES)];
  if(focus) rules.unshift('Focus: '+focus);
  return { id:null, date, assets: S.settings.defaultAsset ? [S.settings.defaultAsset] : [], levels:'', news:'',
    scenarios:[{if:'', then:''}], checklist: rules.map(t=>({text:t, done:false})), notes:'', images:[], review:null };
}
function loadPlanForm(date){
  const ex = planFor(date);
  try{
    const d = JSON.parse(localStorage.getItem(PLAN_DRAFT_KEY)||'null');
    if(d && d.date===date && (d.id||null)===(ex ? ex.id : null)) return d;
  }catch(e){}
  return ex ? JSON.parse(JSON.stringify(ex)) : blankPlan(date);
}
const savePlanDraft = p => { try{ localStorage.setItem(PLAN_DRAFT_KEY, JSON.stringify(p)); }catch(e){} };
const clearPlanDraft = () => { try{ localStorage.removeItem(PLAN_DRAFT_KEY); }catch(e){} };
const planHasContent = p => !!(p && ((p.levels||'').trim() || (p.news||'').trim() || (p.notes||'').trim() || (p.images||[]).length || (p.scenarios||[]).some(s=>(s.if||'').trim()||(s.then||'').trim())));

function savePlan(stay){
  const p = UI.planForm; if(!p) return;

  const rec = { id: p.id || uid(), date: p.date, assets: [...(p.assets||[])], levels: (p.levels||'').trim(), news: (p.news||'').trim(),
    scenarios: (p.scenarios||[]).map(x=>({if:(x.if||'').trim(), then:(x.then||'').trim()})).filter(x=>x.if||x.then),
    checklist: (p.checklist||[]).map(c=>({text:c.text, done:!!c.done})), notes: (p.notes||'').trim(), images: [...(p.images||[])],
    review: p.review || null, createdAt: orig ? (orig.createdAt||now) : now, updatedAt: now };
  if(!rec.scenarios.length && stay!==true) rec.scenarios = [];
  S.plans = (S.plans||[]).filter(x=>x.id!==rec.id); S.plans.push(rec);
  if(orig) forgetImages((orig.images||[]).filter(id=>!rec.images.includes(id)));
  save(); clearPlanDraft();
  if(stay===true){ p.id = rec.id; return rec; }
  UI.planForm = null; UI.form.kind = 'taken';
  toast(orig ? 'Plan updated' : 'Plan saved · good luck today');
  const dest = UI.planReturn || 'calendar'; UI.planReturn = null; nav(dest);
  return rec;
}

  openSheet(`
    <h3>End-of-day check</h3>
    <p class="desc">${esc(fmtDateShort(date))} · ${dayTrades.length} trade${dayTrades.length===1?'':'s'}${dayTrades.length ? ' · '+money(dayTrades.reduce((s,t)=>s+tradePnl(t),0),true) : ''}. Ten seconds, honest answers.</p>
    ${REVIEW_Q.map(([k,label,opts])=>`<div class="section-label" style="margin-top:14px">${label}</div>

    g.querySelectorAll('[data-v]').forEach(x=> x.classList.toggle('on', x.dataset.v===r[g.dataset.rv]));
  });
  document.getElementById('rv-save').onclick = ()=>{
    r.note = document.getElementById('rv-note').value.trim();
    if(!r.respected && !r.followed && !r.grade && !r.note) return toast('Answer at least one');
    const cur = planFor(date); if(!cur) return closeSheet();

function planCompare(list){

  const days = Object.keys(byDay);
  const grp = ds => { const ts = ds.flatMap(d=>byDay[d]), pnl = ts.reduce((s,t)=>s+tradePnl(t),0), w = ts.filter(t=>classify(t)==='win').length;
    return { days: ds.length, trades: ts.length, wins: w, pnl, winRate: ts.length ? w/ts.length*100 : null, avgDay: ds.length ? pnl/ds.length : null }; };
  const tg = ts => { const pnl = ts.reduce((s,t)=>s+tradePnl(t),0), w = ts.filter(t=>classify(t)==='win').length;
    return { trades: ts.length, wins: w, pnl, winRate: ts.length ? w/ts.length*100 : null, avgTrade: ts.length ? pnl/ts.length : null }; };
  const grades = {};
  ['A','B','C'].forEach(g=>{ const ds = days.filter(d=>{ const p = planFor(d); return p && p.review && p.review.grade===g; }); grades[g] = grp(ds); });
  return { withPlan: grp(days.filter(d=>planFor(d))), noPlan: grp(days.filter(d=>!planFor(d))),
    onPlan: tg(list.filter(t=>t.onPlan==='yes')), offPlan: tg(list.filter(t=>t.onPlan==='no')),
    rulesKept: tg(list.filter(t=>t.rulesOk==='yes')), rulesBroken: tg(list.filter(t=>t.rulesOk==='no')), grades };
}

/* ---- structured Plan / Result fields on the trade form ---- */
function writeJournalLine(notes, kind, vals){
  const isPlan = kind==='plan';
  const re = new RegExp('^(\\s*)'+(isPlan ? '(?:Plan|P)' : '(?:Result|E)')+'\\s*:(.*)$', 'im');
  const m = notes.match(re);
  let rest = m ? m[2] : '';
  if(isPlan) rest = rest.replace(/(SL|TP)\s*\d+(?:\.\d+)?/ig,'').replace(/\d{3,}(?:\.\d+)?/, '');
  else rest = rest.replace(/Best\s*\+?\s*\d*(?:\.\d+)?/i,'').replace(/Worst\s*-?\s*\d*(?:\.\d+)?/i,'').replace(/\bout\s*@?\s*\d*(?:\.\d+)?/i,'').replace(/BE\s*@\s*\d*(?:\.\d+)?/i,'');
  rest = rest.replace(/\s+/g,' ').trim();
  const line = isPlan
    ? 'Plan: ' + [vals.entry, vals.sl ? 'SL'+vals.sl : '', vals.tp ? 'TP'+vals.tp : '', rest].filter(Boolean).join(' ')
    : 'Result: ' + [vals.best ? 'Best+'+vals.best : 'Best+', vals.worst ? 'Worst-'+vals.worst : 'Worst-', vals.exit ? 'out'+vals.exit : 'out', vals.be ? 'BE@'+vals.be : 'BE@', rest].filter(Boolean).join(' ');
  if(m) return notes.replace(re, line);
  if(isPlan) return line + (notes ? '\n' + notes : '\n');
  const lines = notes.split('\n');
  let at = lines.findIndex(l=>/^\s*(During)\s*:/i.test(l));
  if(at<0) at = lines.findIndex(l=>/^\s*(Plan|P)\s*:/i.test(l));
  lines.splice(at<0 ? lines.length : at+1, 0, line);
  return lines.join('\n');
}

/* Template button: fill in the template's headings around what you've already written */
function applyTemplate(notes, tpl){
  const keyOf = l => { const m = String(l).match(/^\s*([A-Za-z]+)\s*:/); if(!m) return null; const k = m[1].toLowerCase(); return ({p:'plan', e:'result', pre:'before', post:'after', l:'lesson'})[k] || k; };
  const nLines = String(notes).split('\n'), used = new Set(), out = [];
  String(tpl).replace(/\n+$/,'').split('\n').forEach(tl=>{
    const k = keyOf(tl);
    const i = k===null ? -1 : nLines.findIndex((l,j)=> !used.has(j) && keyOf(l)===k);
    if(i>=0){ used.add(i); out.push(nLines[i]); } else out.push(tl);
  });
  nLines.forEach((l,j)=>{
    if(used.has(j) || !l.trim()) return;

    if(onChart && CH.series && c && CH.tf===lab){
      const built = chBuild(c.bars, lab), lastT = CH.bars.length ? CH.bars[CH.bars.length-1].t : -1;

function chCheckAlerts(fresh, lab){

  let lo = CH.prevPx, hi = CH.prevPx;
  fresh.forEach(c=>{ if(c.t < CH.seen.t) return;
    if(c.t===CH.seen.t){ if(c.h > CH.seen.h) hi = Math.max(hi, c.h); if(c.l < CH.seen.l) lo = Math.min(lo, c.l); }
    else { hi = Math.max(hi, c.h); lo = Math.min(lo, c.l); } });

  CH.seen = {t:last.t, h:last.h, l:last.l, tf:lab}; CH.prevPx = last.c;
  const now = Date.now(); let hit = 0;
  (S.alerts||[]).forEach(a=>{ if(a.active && a.price>=lo && a.price<=hi && now - a.createdAt > 5000){ a.active = false; a.triggeredAt = now; a.updatedAt = now; hit++; chNotify(a); } });

}

    c.fillStyle = st==='open' ? '#14110a' : '#e9ecef'; c.textAlign = 'center'; c.fillText(lbl, lx, ly+.5);
    c.font = "500 10.5px 'JetBrains Mono', ui-monospace, monospace"; c.textAlign = 'center';
    c.fillStyle = '#35d39a'; c.fillText('Target '+d.target.toFixed(2)+' · '+n.tp+' pips', mid, yt + (yt<ye ? 10 : -10));
    c.fillStyle = '#ff6b6b'; c.fillText('Stop '+d.stop.toFixed(2)+' · '+n.sl+' pips', mid, ys + (ys>ye ? -10 : 10));
    if(d.text){ c.fillStyle = '#e9ecef'; c.textAlign = 'left'; c.fillText(d.text, xa+4, ye + (d.type==='long' ? 32 : -32)); }
  }
  else if(d.type==='text'){ const x = xOf(P[0].t), y = yOf(P[0].p); if(x===null || y===null) return;
    c.font = "600 12.5px 'Space Grotesk', Inter, sans-serif"; c.fillStyle = col; c.textAlign = 'left'; c.fillText(d.text || 'Text', x, y);
    if(sel){ const w = c.measureText(d.text||'Text').width; c.strokeStyle = hexA(col,.6); c.lineWidth = 1; c.strokeRect(x-4, y-11, w+8, 22); } }
  if(sel || d===CH.make){ chHandles(d).forEach(h=>{ if(h.x===null || h.y===null) return; c.fillStyle = '#0d0f12'; c.strokeStyle = '#e9ecef'; c.lineWidth = 1.5; c.beginPath(); c.rect(h.x-4.5, h.y-4.5, 9, 9); c.fill(); c.stroke(); }); }
}

/* ---------- hit testing + input ---------- */
function segDist(px,py, ax,ay, bx,by){ const dx = bx-ax, dy = by-ay, L = dx*dx+dy*dy; let t = L ? ((px-ax)*dx + (py-ay)*dy)/L : 0; t = Math.max(0, Math.min(1, t)); return Math.hypot(px-(ax+t*dx), py-(ay+t*dy)); }
function chHit(x, y, touch){
  const tol = touch ? 14 : 7, pw = paneW();
  if(CH.sel && CH.sel.kind==='d'){ const d = chFind(CH.sel.id); if(d){ const h = chHandles(d).find(h=> h.x!==null && h.y!==null && Math.abs(h.x-x)<=tol+2 && Math.abs(h.y-y)<=tol+2); if(h) return { kind:'d', id:d.id, handle:h.k }; } }
  const D = chDrawings();
  for(let i=D.length-1;i>=0;i--){ const d = D[i], P = d.pts;
    try{
      if(d.type==='trend'){ if(segDist(x,y, xOf(P[0].t),yOf(P[0].p), xOf(P[1].t),yOf(P[1].p)) <= tol) return {kind:'d', id:d.id}; }
      else if(d.type==='ray'){ const x0 = xOf(P[0].t), y0 = yOf(P[0].p); if(x >= x0-tol && Math.abs(y-y0) <= tol) return {kind:'d', id:d.id}; }
      else if(d.type==='rect' || d.type==='fib'){ const x1 = xOf(P[0].t), x2 = xOf(P[1].t), y1 = yOf(P[0].p), y2 = yOf(P[1].p);
        if(x>=Math.min(x1,x2)-tol && x<=Math.max(x1,x2)+tol && y>=Math.min(y1,y2)-tol && y<=Math.max(y1,y2)+tol){
          const edge = Math.min(Math.abs(x-x1), Math.abs(x-x2), Math.abs(y-y1), Math.abs(y-y2)) <= tol;
          if(d.type==='fib' || edge || d.type==='rect') return {kind:'d', id:d.id}; } }
      else if(d.type==='long' || d.type==='short'){ const x1 = xOf(P[0].t), x2 = xOf(d.t2), ys = yOf(d.stop), yt = yOf(d.target);
        if(x>=Math.min(x1,x2) && x<=Math.max(x1,x2) && y>=Math.min(ys,yt) && y<=Math.max(ys,yt)) return {kind:'d', id:d.id}; }
      else if(d.type==='text'){ const x0 = xOf(P[0].t), y0 = yOf(P[0].p); CH.ctx.font = "600 12.5px 'Space Grotesk', Inter, sans-serif"; const w = CH.ctx.measureText(d.text||'Text').width;
        if(x>=x0-6 && x<=x0+w+6 && Math.abs(y-y0)<=12) return {kind:'d', id:d.id}; }
    }catch(e){}
  }
  const A = (S.alerts||[]).filter(a=>a.active);
  for(const a of A){ const ya = yOf(a.price); if(ya!==null && Math.abs(ya-y)<=tol && x<=pw) return {kind:'a', id:a.id}; }
  return null;
}
function chXY(e){
  const r = CH.box.getBoundingClientRect(), p = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
  return { x: p.clientX - r.left, y: p.clientY - r.top, touch: !!e.touches };
}
function chDown(e){
  if(!CH.chart || (e.button!==undefined && e.button!==0 && !e.touches)) return;
  if(e.touches && e.touches.length>1) return;
  if(e.target === CH.plus) return;
  const {x, y, touch} = chXY(e); if(x > paneW() || y > paneH()) return;
  const t = tOfX(x), p = pOfY(y); if(t===null || p===null) return;
  /* drawing mode: place points */
  if(CH.tool!=='cursor'){
    e.preventDefault(); e.stopPropagation();
    if(CH.tool==='alert'){ chAddAlert(p, ''); CH.tool = 'cursor'; chRail(); return; }
    if(CH.make && CH.make.wait){ CH.make.pts[1] = {t, p}; delete CH.make.wait; chFinish(CH.make); return; }
    const d = chNewDrawing(CH.tool, {t, p});
    if(['ray','text','long','short'].includes(CH.tool)){ chFinish(d); return; }
    CH.make = d; CH.drag = { mode:'make', x0:x, y0:y };
    chTrack(touch); return;
  }
  /* select mode: grab a drawing or alert, otherwise let the chart pan */
  const h = chHit(x, y, touch);
  if(!h){ if(CH.sel){ CH.sel = null; chToolbar(); } return; }
  e.preventDefault(); e.stopPropagation();
  CH.sel = { kind:h.kind, id:h.id }; chToolbar();
  if(h.kind==='a'){ const a = (S.alerts||[]).find(z=>z.id===h.id); CH.drag = { mode:'alert', a, p0:a.price, y0:y }; }
  else { const d = chFind(h.id); CH.drag = { mode: h.handle!==undefined ? 'handle' : 'move', d, handle:h.handle, t0:t, p0:p, l0: CH.chart.timeScale().coordinateToLogical(x), orig: JSON.parse(JSON.stringify(d)), x0:x, y0:y }; }
  chTrack(touch);
}
function chTrack(touch){
  const move = ev => { if(!CH.drag) return; ev.preventDefault && ev.cancelable && ev.preventDefault(); const {x, y} = chXY(ev); chMove(x, y); };
  const up = ev => { window.removeEventListener(touch ? 'touchmove' : 'mousemove', move, {passive:false}); window.removeEventListener(touch ? 'touchend' : 'mouseup', up); window.removeEventListener('touchcancel', up);
    const g = CH.drag; CH.drag = null; if(!g) return;
    if(g.mode==='make'){ const {x, y} = chXY(ev); if(Math.hypot(x-g.x0, y-g.y0) < 6){ CH.make.wait = true; return; } chFinish(CH.make); return; }
    if(g.mode==='alert'){ const a = g.a; if(a.price!==g.p0){ a.createdAt = Date.now(); a.updatedAt = Date.now(); save(); chPanel(); } return; }
    const d = g.d; if(JSON.stringify(d)!==JSON.stringify(g.orig)){ d.updatedAt = Date.now(); if((d.type==='long'||d.type==='short') && d.logId) chSyncBoxLog(d); save(); } };
  window.addEventListener(touch ? 'touchmove' : 'mousemove', move, {passive:false});
  window.addEventListener(touch ? 'touchend' : 'mouseup', up);
  if(touch) window.addEventListener('touchcancel', up);
}
function chMove(x, y){
  const g = CH.drag, t = tOfX(x), p = pOfY(y); if(!g || t===null || p===null) return;
  if(g.mode==='make'){ CH.make.pts[1] = {t, p}; return; }
  if(g.mode==='alert'){ g.a.price = p; return; }
  const d = g.d, o = g.orig;
  if(g.mode==='move'){
    const dl = CH.chart.timeScale().coordinateToLogical(x) - g.l0, dp = r2p(p - g.p0);
    const sh = q => ({ t: lToT(tToL(q.t) + dl), p: r2p(q.p + dp) });
    d.pts = o.pts.map(sh);
    if(d.type==='long' || d.type==='short'){ d.stop = r2p(o.stop + dp); d.target = r2p(o.target + dp); d.t2 = lToT(tToL(o.t2) + dl); }
    return;
  }
  const k = g.handle;
  if(d.type==='long' || d.type==='short'){
    const up = d.type==='long', e0 = d.pts[0].p;
    if(k==='entry'){ d.pts[0] = { t, p }; if(up ? d.stop>=p : d.stop<=p) d.stop = r2p(p + (up?-1:1)*XAU_PIP); if(up ? d.target<=p : d.target>=p) d.target = r2p(p + (up?1:-1)*XAU_PIP); }
    else if(k==='stop'){ d.stop = up ? Math.min(p, r2p(e0 - XAU_PIP)) : Math.max(p, r2p(e0 + XAU_PIP)); }
    else if(k==='target'){ d.target = up ? Math.max(p, r2p(e0 + XAU_PIP)) : Math.min(p, r2p(e0 - XAU_PIP)); }
    else if(k==='t2'){ if(tToL(t) > tToL(d.pts[0].t)) d.t2 = t; }
    return;
  }
  d.pts[k] = { t, p };
}
function chHoverMove(e){
  if(!CH.chart || CH.drag || CH.tool!=='cursor' || e.buttons) { if(CH.plus) CH.plus.hidden = true; return; }
  if(e.target === CH.plus) return;
  const {x, y} = chXY(e), pw = paneW(), ph = paneH();
  if(x > pw || y > ph || x < 0 || y < 0){ CH.hover = null; CH.plus.hidden = true; return; }
  const p = pOfY(y); if(p===null) return;
  CH.hover = { y, p }; CH.plus.hidden = false; CH.plus.style.transform = 'translate('+(pw-30)+'px,'+(y-11)+'px)';
  CH.plus.title = 'Add alert at '+p.toFixed(2);
}
document.addEventListener('keydown', e=>{

function renderStats(){

  const decided = wins.length + losses.length;

  const grossW = wins.reduce((s,t)=>s+tradePnl(t),0);
  const grossL = Math.abs(losses.reduce((s,t)=>s+tradePnl(t),0));
  const pf = grossL > 0 ? (grossW/grossL) : (grossW > 0 ? Infinity : null);
  const todayPnl = S.trades.filter(t=>t.accountId===aid && t.date===todayISO()).reduce((s,t)=>s+tradePnl(t),0);
  const isCurrent = y===now.getFullYear() && m===now.getMonth();
  const bp = moneyParts(bal);
  const startBal = acct(aid).startingBalance || 0;
  const pctBase = (bal - monthPnl);
  const monthPct = pctBase !== 0 ? (monthPnl/Math.abs(pctBase)*100) : null;
  const goal = acct(aid).monthlyGoal || 0;
  const goalPct = goal>0 ? Math.max(0, Math.min(100, (monthPnl/goal)*100)) : 0;
  const goalHit = goal>0 && monthPnl >= goal;

  /* per-asset breakdown for the selected month */
  const byAsset = {};
  mt.forEach(t=>{
    byAsset[t.asset] = byAsset[t.asset] || {n:0,pnl:0,w:0,l:0};
    const b = byAsset[t.asset]; b.n++; b.pnl += tradePnl(t);
    const k = classify(t); if(k==='win') b.w++; else if(k==='loss') b.l++;
  });
  const assetRows = Object.entries(byAsset).sort((a,b)=> b[1].pnl - a[1].pnl);

  const SAMPLE_N = 30;
  /* Combos card: all time on this account */
  const combo = comboStats(S.trades.filter(t=>t.accountId===aid));
  const COMBO_SHOW = 5;
  const comboShown = UI.combosAll ? combo.rows : combo.rows.slice(0, COMBO_SHOW);
  const comboRowHTML = c => {
    const fillPct = Math.min(c.nR, SAMPLE_N)/SAMPLE_N*100;
    const full = c.nR >= SAMPLE_N;
    const seg = (cls, v) => v ? `<i class="${cls}" style="flex:${v}"></i>` : '';
    return `<button class="setup-row" data-combo="${esc(c.id)}" aria-label="Show ${c.n} trades for ${esc(c.id)}">
      <div class="combo-top">
        <div class="combo-tags">
          <span class="mini-tag">${esc(c.level)}</span>
          <span class="combo-plus" aria-hidden="true">+</span>
          <span class="mini-tag">${esc(c.entry)}</span>
        </div>
        <div class="combo-adj">
          <b style="color:${rColor(c.adjR)}">${c.nR ? fmtR(c.adjR) : money(c.pnl,true)}</b>
          <span>${c.nR ? 'estimate' : 'no R yet'}</span>
        </div>
        <span class="setup-chev">${I.chevR}</span>
      </div>
      <div class="combo-mid">
        <span class="grow">${c.n} trade${c.n===1?'':'s'} · <span class="${c.w?'w':''}" style="${c.w?'color:var(--green)':''}">${c.w}W</span> <span style="${c.l?'color:var(--red)':''}">${c.l}L</span> <span style="${c.be?'color:var(--ink-dim)':''}">${c.be}BE</span>${c.refined ? ' · '+c.refined+' refined' : ''}</span>
        ${c.verdict ? `<span class="verdict ${c.verdict}">${c.verdict==='edge'?'Edge':'Leak'}</span>` : ''}
      </div>
      <div class="meter" role="img" aria-label="${c.w} wins, ${c.l} losses, ${c.be} breakeven. ${c.nR} of ${SAMPLE_N} trades with R">
        <div class="meter-track"><div class="meter-fill" style="width:${fillPct}%">${seg('w',c.w)}${seg('l',c.l)}${seg('b',c.be)}</div></div>
        <span class="meter-n ${full?'full':''}">${full ? c.nR : c.nR+'/'+SAMPLE_N}</span>
      </div>
    </button>`;
  };

  /* By setup: one tab per tag group, month or all time */
  const setupRange = UI.setupRange || 'month';
  const setupList = setupRange==='all' ? S.trades.filter(t=>t.accountId===aid) : mt;
  const usedOther = setupList.some(t=>(t.tags||[]).some(tg=>tagGroup(tg)==='other'));
  const setupTabs = [...TAG_GROUPS.map(g=>g.key), ...(usedOther?['other']:[])];
  let setupGroup = UI.setupGroup || 'level';
  if(!setupTabs.includes(setupGroup)) setupGroup = 'level';
  const SAMPLE = 30;
  const noneLabel = { level:'No level', entry:'No entry', refine:'No refinement' };
  const byTag = {};
  const bump = (key, t) => {
    const b = byTag[key] = byTag[key] || {n:0,pnl:0,w:0,l:0,be:0};
    b.n++; b.pnl += tradePnl(t);
    const k = classify(t); if(k==='win') b.w++; else if(k==='loss') b.l++; else b.be++;
  };
  setupList.forEach(t=>{
    const inGroup = (t.tags||[]).filter(tg=>tagGroup(tg)===setupGroup);
    if(inGroup.length) inGroup.forEach(tg=>bump(tg, t));
    else if(setupGroup!=='other') bump('\u0000none', t);
  });
  const tagRows = Object.entries(byTag).sort((a,b)=> (b[1].n - a[1].n) || (b[1].pnl - a[1].pnl));
  const setupPnl = setupList.reduce((s,t)=>s+tradePnl(t),0);
  const setupRowHTML = ([tg,b]) => {
    const isNone = tg==='\u0000none';
    const label = isNone ? noneLabel[setupGroup] : tg;
    const won = b.n ? Math.round(b.w/b.n*100) : 0;
    const fillPct = Math.min(b.n, SAMPLE)/SAMPLE*100;
    const full = b.n >= SAMPLE;
    const seg = (cls, v) => v ? `<i class="${cls}" style="flex:${v}"></i>` : '';
    return `<button class="setup-row" ${isNone?'data-none="1"':`data-skey="${esc(tg)}"`} aria-label="Show ${b.n} ${esc(label)} trade${b.n===1?'':'s'}">
      <div class="setup-head">
        <span class="mini-tag ${isNone?'none':''}">${esc(label)}</span>
        <span class="setup-count">${b.n} trade${b.n===1?'':'s'} · <span class="${b.w?'w':''}">${b.w}W</span> <span class="${b.l?'l':''}">${b.l}L</span> <span class="${b.be?'b':''}">${b.be}BE</span></span>
        <div class="setup-pnl">
          <b style="color:${b.pnl>0?'var(--green)':b.pnl<0?'var(--red)':'var(--ink-dim)'}">${money(b.pnl,true)}</b>
          <span>${won}% won</span>
        </div>
        <span class="setup-chev">${I.chevR}</span>
      </div>
      <div class="meter" role="img" aria-label="${b.w} wins, ${b.l} losses, ${b.be} breakeven. ${full ? 'Sample of '+b.n+' trades' : b.n+' of '+SAMPLE+' trades needed'}">
        <div class="meter-track"><div class="meter-fill" style="width:${fillPct}%">${seg('w',b.w)}${seg('l',b.l)}${seg('b',b.be)}</div></div>
        <span class="meter-n ${full?'full':''}">${full ? b.n : b.n+'/'+SAMPLE}</span>
      </div>
    </button>`;
  };

  const assetCardHTML = assetRows.length ? `
  <div class="card-navy">
    <div class="card-title"><h3>By asset</h3><span class="sub">${MONTHS_S[m]} ${y} · trades · win rate</span></div>
    ${hbarsHTML(assetRows.map(([sym,b])=>({label:sym, pnl:b.pnl, n:b.n, w:b.w})))}
  </div>` : '';

  /* missed trades this month: never part of the numbers above */
  const mm = S.missed.filter(t=>t.accountId===aid && inMonth(t.date,y,m));
  const mmWith = mm.filter(t=>(t.layers||[]).length);
  const mmSum = mmWith.reduce((s,t)=>s+tradePnl(t),0);
  const mmCount = {}; mm.forEach(t=>{ const k = t.reason||'none'; mmCount[k] = (mmCount[k]||0)+1; });
  const mmReasons = Object.entries(mmCount).sort((a,b)=>b[1]-a[1]);
  const dsr = dailySeries(aid, y, m);
  const C = {
    head: `<div class="page-head"><div><h2>Stats</h2><p>Your results, charted</p></div>${S.accounts.length>1?`<div class="acct-select">
        <select id="stats-acct" aria-label="Select account">
          ${S.accounts.map(a=>`<option value="${a.id}" ${a.id===aid?'selected':''}>${esc(a.name)}</option>`).join('')}
        </select>
        ${I.chevD}
      </div>`:`<span class="ph-acct">${esc(acct(aid).name)}</span>`}</div>`,
    plan: planCardHTML(aid),
    kpis: kpiHTML({m, pnl:monthPnl, n:mt.length, days:dsr.day.filter(d=>d.n).length, day:dsr.day, winrate, wins:wins.length, losses:losses.length, bes:bes.length, pf, grossW, grossL}),
    perf: `
  <div class="card-navy chart-card">
    <div class="card-title"><h3>Performance</h3><span class="sub">${MONTHS[m]} ${y} · by day</span></div>
    <div class="chart-wrap" data-chart="perf"></div>
  </div>`,
    weekday: `
  <div class="card-navy chart-card">
    <div class="card-title"><h3>By weekday</h3><span class="sub">All time</span></div>
    <div class="chart-wrap" data-chart="weekday"></div>
  </div>`,
    hour: `
  <div class="card-navy chart-card">
    <div class="card-title"><h3>By hour of day</h3><span class="sub">Entry time, SGT · all time</span></div>
    <div class="chart-wrap" data-chart="hour"></div>
  </div>`,
    hero: `
  <div class="hero">
    <div class="label-row">
      <span class="label">Account balance</span>
      <span class="hero-acct">${esc(acct(aid).name)}</span>
    </div>
    <div class="amount">${bp.main}<span class="cents">${bp.cents}</span></div>
    <div class="chip-row">
      <span class="chip ${monthPnl>0?'pos':monthPnl<0?'neg':'neutral'}">${monthPnl>=0?I.up:I.down}${monthPct===null?'—':(monthPnl>=0?'+':'')+monthPct.toFixed(2)+'%'} · ${MONTHS_S[m]}</span>
      <span class="chip ${todayPnl>0?'pos':todayPnl<0?'neg':'neutral'}">${money(todayPnl,true)} · Today</span>
    </div>
    <div class="hero-actions">
      <button data-act="deposit">${I.dl}<span>Deposit</span></button>
      <button data-act="withdraw">${I.ul}<span>Withdraw</span></button>
    </div>
  </div>
`,
    combo: `
  <div class="card-navy" id="combo-card">
    <div class="card-title"><h3>Combos</h3><span class="sub">All time</span></div>
    ${combo.rows.length ? `
      <p class="combo-cover"><b>${combo.withR}</b> of <b>${combo.total}</b> trades have R from your journal${combo.skipped ? ` · <b>${combo.skipped}</b> left out for missing or doubled tags` : ''}</p>
      ${combo.needsFix.length ? `<button class="fix-banner" data-fix-list>
        <span><b>${combo.needsFix.length} trade${combo.needsFix.length===1?'':'s'}</b> ${combo.needsFix.length===1?'has':'have'} journal numbers that don't add up, so ${combo.needsFix.length===1?'it is':'they are'} left out of R.</span>
        <span class="fix-cta">Review ${I.chevR}</span>
      </button>` : ''}
      ${comboShown.map(comboRowHTML).join('')}
      ${combo.rows.length > COMBO_SHOW ? `<button class="combo-more" data-combos-all>${UI.combosAll ? 'Show top '+COMBO_SHOW : 'Show all '+combo.rows.length+' combos'}</button>` : ''}
      <p class="setup-note">Each combo is a level plus an entry; refined and unrefined trades count together. Sorted by estimated R per trade: a combo with few trades is pulled toward your overall average of ${fmtR(combo.avgR)}, so one lucky trade can't top the list. Edge and Leak only appear once a combo's result is clearly above or below 0R.</p>`
      : `<div class="empty-chart">${combo.total ? 'Tag trades with one level and one entry to see combos.' : 'No trades logged on this account yet.'}</div>`}
  </div>
`,
    month: `
  <div class="month-row">
    <button class="m-btn" id="m-prev" aria-label="Previous month">${I.chevL}</button>
    <span class="m-label">${MONTHS[m]} ${y}</span>
    <button class="m-btn" id="m-next" aria-label="Next month" ${isCurrent?'disabled':''}>${I.chevR}</button>
  </div>
`,
    goal: `
  ${goal>0 ? `
  <div class="card-navy">
    <div class="card-title"><h3>Monthly goal</h3><span class="sub">${goalHit?'Goal reached':money(goal)+' target'}</span></div>
    <div class="wl-bar" style="height:14px">
      <span style="width:${goalPct}%;background:${goalHit?'var(--green)':'var(--gold)'}"></span>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:.78rem;color:var(--ink-dim)">
      <span>${money(monthPnl,true)} of ${money(goal)}</span>
      <span style="font-weight:600;color:${goalHit?'var(--green)':'var(--gold-1)'}">${goalPct.toFixed(0)}%</span>
    </div>
  </div>` : ''}
`,
    grid: `
  <div class="stat-grid">
    <div class="stat-cell"><div class="k">${I.target}Win rate</div><div class="v">${winrate===null?'—':winrate.toFixed(1)+'%'}</div></div>
    <div class="stat-cell"><div class="k">${I.scale}Profit factor</div><div class="v">${pf===null?'—':pf===Infinity?'∞':pf.toFixed(2)}</div></div>
  </div>
`,
    wl: `
  <div class="card-navy">
    <div class="card-title"><h3>Wins vs losses</h3><span class="sub">${mt.length} trade${mt.length===1?'':'s'} · ${MONTHS_S[m]} ${y}</span></div>
    ${mt.length ? `
    <div class="wl-bar">
      <span style="width:${(wins.length/mt.length*100)}%;background:var(--green)"></span>
      <span style="width:${(losses.length/mt.length*100)}%;background:var(--red)"></span>
      <span style="width:${(bes.length/mt.length*100)}%;background:#6a727c"></span>
    </div>
    <div class="wl-legend">
      <span class="li"><span class="dot" style="background:var(--green)"></span><b>${wins.length}</b>&nbsp;Wins</span>
      <span class="li"><span class="dot" style="background:var(--red)"></span><b>${losses.length}</b>&nbsp;Losses</span>
      <span class="li"><span class="dot" style="background:#6a727c"></span><b>${bes.length}</b>&nbsp;Breakeven</span>
    </div>` : `<div class="empty-chart">No trades taken this month.</div>`}
  </div>
`,
    asset: `
  ${assetCardHTML}
`,
    setup: `
  <div class="card-navy" id="setup-card">
    <button class="card-toggle" data-bd-toggle aria-expanded="${!!UI.breakdownOpen}">
      <span><h3>Breakdown</h3><span class="sub">Level, entry and refinement on their own</span></span>
      <span class="chev">${I.chevR}</span>
    </button>
    ${UI.breakdownOpen ? `
    <div class="bd-range">
      <div class="setup-range" role="group" aria-label="Time range">
        <button data-range="month" class="${setupRange==='month'?'on':''}" aria-pressed="${setupRange==='month'}">${MONTHS_S[m]} ${y}</button>
        <button data-range="all" class="${setupRange==='all'?'on':''}" aria-pressed="${setupRange==='all'}">All time</button>
      </div>
    </div>
    <div class="setup-tabs" role="group" aria-label="Tag group">
      ${setupTabs.map(k=>`<button data-sgroup="${k}" class="${k===setupGroup?'on':''}" aria-pressed="${k===setupGroup}">${GROUP_LABEL[k]}</button>`).join('')}
    </div>
    ${setupList.length ? `
      <div class="setup-total"><span>Total</span><span><b>${setupList.length}</b> trade${setupList.length===1?'':'s'} · <b style="color:${setupPnl>0?'var(--green)':setupPnl<0?'var(--red)':'var(--ink-dim)'}">${money(setupPnl,true)}</b></span></div>
      ${tagRows.map(setupRowHTML).join('')}
      <p class="setup-note">${setupGroup==='other'
        ? 'A trade can carry several of these, so rows can add up to more than the total.'
        : 'Each trade counts once, so rows add up to the total above. A bar fills at '+SAMPLE+' trades; until then, treat the row as an early hint.'}</p>`
      : `<div class="empty-chart">${setupRange==='all' ? 'No trades logged on this account yet.' : 'No trades this month. Switch to All time to see every trade.'}</div>`}
    ` : ''}
  </div>
`,
    equity: `
  <div class="card-navy">
    <div class="card-title"><h3>Equity &amp; drawdown</h3><span class="sub">All time</span></div>
    <div class="chart-wrap" data-chart="equity"></div>
  </div>
`,
    monthly: `
  <div class="card-navy">
    <div class="card-title"><h3>Monthly PnL</h3><span class="sub">Up to ${MONTHS_S[m]} ${y}</span></div>
    <div class="chart-wrap" data-chart="monthly"></div>
  </div>
`,
    missed: `
  <div class="card-navy">
    <div class="card-title"><h3>Logs</h3><span class="sub">${MONTHS_S[m]} ${y}</span></div>
    ${mm.length ? `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:8px">
      <div><div class="cal-sum" style="font-size:1.35rem;font-weight:600;color:var(--gold-1)">${mm.length}</div><div style="font-size:.7rem;color:var(--ink-faint)">logged</div></div>
      <div style="text-align:right"><div class="cal-sum" style="font-size:1.1rem;font-weight:600;color:${mmWith.length ? (mmSum>0?'var(--green)':mmSum<0?'var(--red)':'var(--ink)') : 'var(--ink-faint)'}">${mmWith.length ? money(mmSum,true) : '—'}</div>
      <div style="font-size:.7rem;color:var(--ink-faint)">${mmWith.length ? 'would have made · '+mmWith.length+' with a result' : 'add a would-have result to see this'}</div></div>
    </div>
    ${mmReasons.map(([k,n])=>`<div class="reason-row"><span class="lab">${esc(reasonLabel(k))}</span><span class="bar"><i style="width:${n/mm.length*100}%"></i></span><b>${n}</b></div>`).join('')}
    <button class="combo-more" data-missed-open style="margin-top:10px">See them in History</button>
    ` : `<div class="empty-chart">No logs this month. To log a setup for forward testing or analysis, open Add entry and switch to Log.</div>`}
  </div>
`
  };
  el.innerHTML = isWide()
    ? `${C.head}${C.month}<div class="stats-top">${C.perf}<div>${C.hero}${C.goal}</div></div>${C.kpis}<div class="chart-pair">${C.weekday}${C.hour}</div><div class="stats-cols"><div>${C.plan}${C.equity}${C.monthly}${C.missed}</div><div>${C.asset}${C.combo}${C.setup}</div></div>`
    : C.head + C.hero + C.month + C.kpis + C.perf + C.goal + C.plan + `<div class="chart-pair">${C.weekday}${C.hour}</div>` + C.equity + C.monthly + C.asset + C.combo + C.missed + C.setup;
  fillCharts(el, {aid, y, m});
  const pcc = el.querySelector('#plan-card-cta'); if(pcc) pcc.onclick = ()=> openPlanEditor(todaySGT());
  const mo = el.querySelector('[data-missed-open]');
  if(mo) mo.onclick = ()=>{ UI.historyKind = 'missed'; UI.historyFilter = S.accounts.length>1 ? aid : 'all'; UI.historyTag = 'all'; UI.historyLimit = 150; nav('history'); };

  const acctSel = el.querySelector('#stats-acct');
  if(acctSel) acctSel.onchange = e => { UI.statsAccountId = e.target.value; renderStats(); };
  const comboCard = el.querySelector('#combo-card');
  if(comboCard) comboCard.onclick = e => {
    if(e.target.closest('[data-combos-all]')){ UI.combosAll = !UI.combosAll; renderStats(); return; }
    if(e.target.closest('[data-fix-list]')){ openFixSheet(); return; }
    const row = e.target.closest('[data-combo]');
    if(row) openComboSheet(row.dataset.combo);
  };
  const setupCard = el.querySelector('#setup-card');
  if(setupCard) setupCard.onclick = e => {
    if(e.target.closest('[data-bd-toggle]')){ UI.breakdownOpen = !UI.breakdownOpen; renderStats(); return; }
    const r = e.target.closest('[data-range]'); if(r){ UI.setupRange = r.dataset.range; renderStats(); return; }
    const g = e.target.closest('[data-sgroup]'); if(g){ UI.setupGroup = g.dataset.sgroup; renderStats(); return; }
    const row = e.target.closest('.setup-row');
    if(row) openSetupSheet({ range:setupRange, group:setupGroup, key:row.dataset.skey||null, none:!!row.dataset.none });
  };
  el.querySelector('#m-prev').onclick = () => { UI.statsM--; if(UI.statsM<0){UI.statsM=11;UI.statsY--;} renderStats(); };
  const nx = el.querySelector('#m-next'); if(nx) nx.onclick = () => { UI.statsM++; if(UI.statsM>11){UI.statsM=0;UI.statsY++;} renderStats(); };
  el.querySelector('[data-act="deposit"]').onclick = () => openTxnSheet(aid,'deposit');
  el.querySelector('[data-act="withdraw"]').onclick = () => openTxnSheet(aid,'withdraw');
}

/* ---------- charts (inline SVG, no libs) ---------- */
function equitySVG(aid){
  const a = acct(aid);
  const events = [
    ...S.trades.filter(t=>t.accountId===aid).map(t=>({date:t.date, ts:whenTs(t), amt:tradePnl(t)})),
    ...S.txns.filter(x=>x.accountId===aid).map(x=>({date:x.date, ts:x.createdAt||0, amt:x.amount}))
  ].sort((p,q)=> p.date===q.date ? p.ts-q.ts : (p.date<q.date?-1:1));
  let bal = a.startingBalance || 0;
  const pts = [bal];
  for(const e of events){ bal += e.amt; pts.push(bal); }
  if(pts.length < 2) return `<div class="empty-chart">The curve starts drawing from your first logged trade.</div>`;
  const W=320,H=140,P=8;
  const min = Math.min(...pts), max = Math.max(...pts);
  const span = (max-min) || 1;
  const X = i => P + i*(W-2*P)/(pts.length-1);
  const Y = v => H-P - (v-min)*(H-2*P)/span;
  let d = `M ${X(0)} ${Y(pts[0])}`;
  for(let i=1;i<pts.length;i++) d += ` L ${X(i).toFixed(1)} ${Y(pts[i]).toFixed(1)}`;
  const last = pts[pts.length-1], up = last >= pts[0];
  const col = up ? 'var(--green)' : 'var(--red)';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Equity curve">
    
    <path d="${d} L ${X(pts.length-1)} ${H-P} L ${X(0)} ${H-P} Z" fill="${up?'#35d39a':'#ff6b6b'}" fill-opacity=".08"/>
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last)}" r="3.6" fill="${col}"/>
  </svg>
  <div class="equity-foot" style="display:flex;justify-content:space-between;margin-top:8px;font-size:.7rem;color:var(--ink-faint)">
    <span>Start ${money(pts[0])}</span><span style="color:${up?'var(--green)':'var(--red)'};font-weight:600">Now ${money(last)}</span>
  </div>`;
}

/* ============================================================
   CHARTS — flat SVG drawn at the real width of their card,
   one shared tooltip (hover, tap or keyboard focus)
   ============================================================ */
const CC = { pos:'#35d39a', neg:'#ff6b6b', flat:'#6a727c', line:'#e3b54f', grid:'#1d2228', base:'#353c46', surf:'#13161a' };
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const monT = m => MONTHS_S[m].charAt(0) + MONTHS_S[m].slice(1).toLowerCase();
const pcol = v => v>0 ? CC.pos : v<0 ? CC.neg : CC.flat;
const tipAttr = (val, label) => ` data-tip="${esc(val)}" data-tip2="${esc(label)}" tabindex="0"`;
/* axis money: $0 / $500 / $1.5K, minus sign for losses */
const axk = v => { const a = Math.abs(v); const s = a>=1000 ? (a/1000).toFixed(a%1000 ? 1 : 0).replace(/\.0$/,'')+'K' : String(Math.round(a)); return (v<0?'−':'')+'$'+s; };
/* bar from baseline y0 to y1: square at the baseline, rounded at the data end */
function barPath(x, w, y0, y1){
  const h = Math.abs(y1-y0); if(h < .5) return '';
  const r = Math.min(3, w/2, h), up = y1 < y0, e = up ? r : -r;
  return `M${x.toFixed(1)},${y0.toFixed(1)}V${(y1+e).toFixed(1)}Q${x.toFixed(1)},${y1.toFixed(1)} ${(x+r).toFixed(1)},${y1.toFixed(1)}H${(x+w-r).toFixed(1)}Q${(x+w).toFixed(1)},${y1.toFixed(1)} ${(x+w).toFixed(1)},${(y1+e).toFixed(1)}V${y0.toFixed(1)}Z`;
}
function niceTicks(min, max, n){
  if(min===max){ max = min + 1; }
  const span = max-min, raw = span/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(s=>s*mag).find(s=>span/s<=n) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step, out = [];
  for(let v=lo; v<=hi+step/2; v+=step) out.push(Math.round(v*100)/100);
  return out;
}
/* one entry per calendar day of the month, up to today for the current month */
function dailySeries(aid, y, m){
  const mt = monthTrades(aid, y, m);
  const dim = new Date(y, m+1, 0).getDate();
  const isCur = y===now.getFullYear() && m===now.getMonth();
  const last = isCur ? Math.min(dim, Math.max(now.getDate(), ...mt.map(t=>+t.date.slice(8)), 1)) : dim;
  const day = Array.from({length:last}, ()=>({pnl:0, n:0, w:0}));
  mt.forEach(t=>{ const d = day[+t.date.slice(8)-1]; if(d){ d.pnl += tradePnl(t); d.n++; if(classify(t)==='win') d.w++; } });
  let c = 0; day.forEach(d=>{ c += d.pnl; d.cum = c; });
  return {day, n:mt.length};
}

/* ---- Performance: cumulative line over daily bars (two panels, one x-axis) ---- */
function perfChart(ctx, W){
  const {day, n} = dailySeries(ctx.aid, ctx.y, ctx.m);
  if(!n) return `<div class="empty-chart">No trades in ${MONTHS[ctx.m]} yet. The chart fills in as you log.</div>`;
  const N = day.length, L = 46, R = 10, T = 10, H1 = W<420 ? 130 : 170, GAP = 22, H2 = W<420 ? 70 : 90, B = 22, H = T+H1+GAP+H2+B;
  const slot = (W-L-R)/N, X = i => L + slot*i + slot/2;
  const cum = day.map(d=>d.cum), dp = day.map(d=>d.pnl);
  const t1 = niceTicks(Math.min(0,...cum), Math.max(0,...cum), 3), a1 = t1[0], b1 = t1[t1.length-1];
  const Y1 = v => T + H1 - (v-a1)/(b1-a1)*H1;
  const t2 = niceTicks(Math.min(0,...dp), Math.max(0,...dp), 2), a2 = t2[0], b2 = t2[t2.length-1];
  const top2 = T+H1+GAP, Y2 = v => top2 + H2 - (v-a2)/(b2-a2)*H2;
  let s = '';
  t1.forEach(v=>{ s += `<line x1="${L}" x2="${W-R}" y1="${Y1(v)}" y2="${Y1(v)}" stroke="${v===0?CC.base:CC.grid}"/><text x="${L-8}" y="${Y1(v)+3.5}" text-anchor="end" class="ax">${axk(v)}</text>`; });
  [a2, 0, b2].filter((v,i,a)=>a.indexOf(v)===i).forEach(v=>{ s += `<line x1="${L}" x2="${W-R}" y1="${Y2(v)}" y2="${Y2(v)}" stroke="${v===0?CC.base:CC.grid}"/><text x="${L-8}" y="${Y2(v)+3.5}" text-anchor="end" class="ax">${axk(v)}</text>`; });
  s += `<text x="${W-R}" y="${top2-8}" text-anchor="end" class="ax cap">DAILY PNL</text>`;
  const pts = cum.map((v,i)=>`${X(i).toFixed(1)},${Y1(v).toFixed(1)}`);
  s += `<path d="M${X(0).toFixed(1)},${Y1(0).toFixed(1)}L${pts.join('L')}L${X(N-1).toFixed(1)},${Y1(0).toFixed(1)}Z" fill="${CC.line}" fill-opacity=".10" class="ar"/>`;
  s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${CC.line}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="ln" pathLength="1"/>`;
  const bw = Math.max(2, Math.min(18, slot-3));
  day.forEach((d,i)=>{ if(d.pnl) s += `<path class="br ${d.pnl>=0?'up':'dn'}" style="animation-delay:${(.2+i*.02).toFixed(2)}s" d="${barPath(X(i)-bw/2, bw, Y2(0), Y2(d.pnl))}" fill="${pcol(d.pnl)}"/>`; });
  const ev = cum[N-1];
  s += `<circle class="ping" cx="${X(N-1).toFixed(1)}" cy="${Y1(ev).toFixed(1)}" r="4" fill="none" stroke="${CC.line}" stroke-width="1.5"/><circle class="dot" cx="${X(N-1).toFixed(1)}" cy="${Y1(ev).toFixed(1)}" r="4" fill="${CC.line}" stroke="${CC.surf}" stroke-width="2"/>`;
  const every = slot < 12 ? 7 : slot < 22 ? 3 : 1;
  for(let i=0;i<N;i++) if(i%every===0) s += `<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="middle" class="ax">${i+1}</text>`;
  day.forEach((d,i)=>{ s += `<rect class="hit" x="${(L+slot*i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${H1+GAP+H2}"${tipAttr(money(d.cum,true), 'Month to date · '+(i+1)+' '+monT(ctx.m)+' · '+(d.n ? money(d.pnl,true)+' from '+d.n+' trade'+(d.n===1?'':'s') : 'no trades'))}/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Cumulative and daily PnL, ${MONTHS[ctx.m]} ${ctx.y}">${s}</svg>
  <div class="ch-legend"><span><i class="lk" style="background:${CC.line}"></i>Cumulative</span><span><i class="sw" style="background:${CC.pos}"></i>Up day</span><span><i class="sw" style="background:${CC.neg}"></i>Down day</span></div>`;
}

/* ---- Columns from a zero baseline: weekday, hour, month ---- */
function colChart(buckets, W, opt){
  opt = opt || {};
  if(!buckets.some(b=>b.n)) return `<div class="empty-chart">${opt.empty||'No trades yet.'}</div>`;
  const L = 6, R = 6, T = 22, PH = opt.h || 120, LAB = 24, H = T + PH + LAB + (opt.counts ? 30 : 20);
  const vals = buckets.map(b=>b.pnl); let mn = Math.min(0,...vals), mx = Math.max(0,...vals); if(mn===mx) mx = 1;
  const Y = v => T + PH - (v-mn)/(mx-mn)*PH, slot = (W-L-R)/buckets.length, bw = Math.min(opt.bw||28, Math.max(4, slot*.62));
  let bi = -1, wi = -1;
  buckets.forEach((b,i)=>{ if(!b.n) return; if(bi<0 || b.pnl>buckets[bi].pnl) bi = i; if(wi<0 || b.pnl<buckets[wi].pnl) wi = i; });
  let s = `<line x1="${L}" x2="${W-R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="${CC.base}"/>`;
  const every = opt.every ? opt.every(slot) : 1;
  buckets.forEach((b,i)=>{
    const cx = L + slot*i + slot/2;
    if(b.n && b.pnl) s += `<path class="br ${b.pnl>=0?'up':'dn'}" style="animation-delay:${(.2+i*.04).toFixed(2)}s" d="${barPath(cx-bw/2, bw, Y(0), Y(b.pnl))}" fill="${pcol(b.pnl)}"/>`;
    else if(b.n) s += `<rect x="${(cx-bw/2).toFixed(1)}" y="${(Y(0)-1).toFixed(1)}" width="${bw.toFixed(1)}" height="2" fill="${CC.flat}"/>`;
    if(b.n && (opt.labelAll || i===bi || i===wi) && !(i===wi && b.pnl>=0 && i!==bi) && !(i===bi && b.pnl<=0 && i!==wi))
      s += `<text x="${cx.toFixed(1)}" y="${(b.pnl>=0 ? Y(b.pnl)-6 : Y(b.pnl)+13).toFixed(1)}" text-anchor="middle" class="vl">${kfmt(b.pnl)}</text>`;
    if(i%every===0) s += `<text x="${cx.toFixed(1)}" y="${T+PH+LAB+8}" text-anchor="middle" class="ax${b.n?'':' dim'}">${esc(b.label)}</text>`;
    if(opt.counts) s += `<text x="${cx.toFixed(1)}" y="${T+PH+LAB+21}" text-anchor="middle" class="ax dim">${b.n ? b.n+(slot>44?' trade'+(b.n===1?'':'s'):'') : '–'}</text>`;
    s += `<rect class="hit" x="${(L+slot*i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${T+PH+LAB}"${tipAttr(b.n ? money(b.pnl,true) : 'No trades', (b.full||b.label)+(b.n ? ' · '+b.n+' trade'+(b.n===1?'':'s')+' · '+Math.round(b.w/b.n*100)+'% won' : ''))}/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(opt.aria||'PnL by period')}">${s}</svg>`;
}
const DOW_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
function weekdayChart(ctx, W){
  const tr = S.trades.filter(t=>t.accountId===ctx.aid);
  const b = DOW.map((d,i)=>({label:d, full:DOW_FULL[i], pnl:0, n:0, w:0}));
  tr.forEach(t=>{ const k = (new Date(t.date+'T00:00:00Z').getUTCDay()+6)%7; b[k].pnl += tradePnl(t); b[k].n++; if(classify(t)==='win') b[k].w++; });
  const shown = b.filter((x,i)=> i<5 || x.n);
  return colChart(shown, W, {labelAll:true, counts:true, bw:36, aria:'PnL by day of week', empty:'No trades on this account yet.'});
}
function hourChart(ctx, W){
  const tr = S.trades.filter(t=>t.accountId===ctx.aid && validTime(t.time));
  if(!tr.length) return `<div class="empty-chart">Add a time to your entries to see which hours pay.</div>`;
  const hs = tr.map(t=>+t.time.slice(0,2)), lo = Math.min(...hs), hi = Math.max(...hs);
  const b = []; for(let h=lo; h<=hi; h++) b.push({label:String(h).padStart(2,'0'), full:String(h).padStart(2,'0')+':00–'+String(h).padStart(2,'0')+':59 SGT', pnl:0, n:0, w:0});
  tr.forEach(t=>{ const x = b[+t.time.slice(0,2)-lo]; x.pnl += tradePnl(t); x.n++; if(classify(t)==='win') x.w++; });
  return colChart(b, W, {bw:22, aria:'PnL by hour of day', every: s=> s<18 ? 3 : s<26 ? 2 : 1});
}
function monthlyChart(ctx, W){
  const k = W >= 460 ? 12 : 6, b = [];
  for(let i=k-1;i>=0;i--){
    let mm = ctx.m-i, yy = ctx.y; while(mm<0){ mm += 12; yy--; }
    const mt = monthTrades(ctx.aid, yy, mm);
    b.push({label:monT(mm), full:MONTHS[mm]+' '+yy, pnl:mt.reduce((s,t)=>s+tradePnl(t),0), n:mt.length, w:mt.filter(t=>classify(t)==='win').length});
  }
  return colChart(b, W, {labelAll:k<=6, bw:26, aria:'PnL by month', empty:'Nothing booked in the last '+k+' months.'});
}

/* ---- Equity with drawdown underneath ---- */
function equityChart(ctx, W, wrap){
  const a = acct(ctx.aid);
  const ev = [
    ...S.trades.filter(t=>t.accountId===ctx.aid).map(t=>({date:t.date, ts:whenTs(t), amt:tradePnl(t)})),
    ...S.txns.filter(x=>x.accountId===ctx.aid).map(x=>({date:x.date, ts:x.createdAt||0, amt:x.amount, txn:true}))
  ].sort((p,q)=> p.date===q.date ? p.ts-q.ts : (p.date<q.date?-1:1));
  if(!ev.length) return `<div class="empty-chart">The curve starts drawing from your first logged trade.</div>`;
  let bal = a.startingBalance||0, peak = bal, maxDD = 0, maxDDp = 0;
  const pts = [{bal, dd:0, date:ev[0].date, start:true}];
  ev.forEach(e=>{ bal += e.amt; if(e.txn) peak += e.amt; peak = Math.max(peak, bal); const dd = bal-peak; if(dd<maxDD){ maxDD = dd; maxDDp = peak ? dd/peak*100 : 0; } pts.push({bal, dd, date:e.date}); });
  const sub = wrap && wrap.closest('.card-navy') && wrap.closest('.card-navy').querySelector('.sub');
  if(sub) sub.textContent = maxDD < 0 ? 'Max drawdown '+money(maxDD)+' ('+maxDDp.toFixed(1)+'%)' : 'No drawdown yet';
  const N = pts.length, L = 54, R = 10, T = 10, H1 = W<420 ? 120 : 150, GAP = 22, H2 = 60, B = 20, H = T+H1+GAP+H2+B;
  const X = i => L + (N===1 ? 0 : i*(W-L-R)/(N-1));
  const bs = pts.map(p=>p.bal), t1 = niceTicks(Math.min(...bs), Math.max(...bs), 3), a1 = t1[0], b1 = t1[t1.length-1];
  const Y1 = v => T + H1 - (v-a1)/(b1-a1)*H1;
  const lo = Math.min(-1, maxDD), t2 = niceTicks(lo, 0, 2), a2 = t2[0];
  const top2 = T+H1+GAP, Y2 = v => top2 + (v/a2)*H2;
  let s = '';
  t1.forEach(v=>{ s += `<line x1="${L}" x2="${W-R}" y1="${Y1(v).toFixed(1)}" y2="${Y1(v).toFixed(1)}" stroke="${CC.grid}"/><text x="${L-8}" y="${(Y1(v)+3.5).toFixed(1)}" text-anchor="end" class="ax">${axk(v)}</text>`; });
  [0, a2].forEach(v=>{ s += `<line x1="${L}" x2="${W-R}" y1="${Y2(v).toFixed(1)}" y2="${Y2(v).toFixed(1)}" stroke="${v===0?CC.base:CC.grid}"/><text x="${L-8}" y="${(Y2(v)+3.5).toFixed(1)}" text-anchor="end" class="ax">${axk(v)}</text>`; });
  s += `<text x="${W-R}" y="${top2-8}" text-anchor="end" class="ax cap">DRAWDOWN</text>`;
  const p1 = pts.map((p,i)=>`${X(i).toFixed(1)},${Y1(p.bal).toFixed(1)}`), p2 = pts.map((p,i)=>`${X(i).toFixed(1)},${Y2(p.dd).toFixed(1)}`);
  s += `<path d="M${X(0)},${T+H1}L${p1.join('L')}L${X(N-1).toFixed(1)},${T+H1}Z" fill="${CC.line}" fill-opacity=".10" class="ar"/>`;
  s += `<polyline points="${p1.join(' ')}" fill="none" stroke="${CC.line}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="ln" pathLength="1"/>`;
  s += `<path d="M${X(0)},${Y2(0)}L${p2.join('L')}L${X(N-1).toFixed(1)},${Y2(0)}Z" fill="${CC.neg}" fill-opacity=".14" class="ar"/>`;
  s += `<polyline points="${p2.join(' ')}" fill="none" stroke="${CC.neg}" stroke-width="1.5" stroke-linejoin="round" class="ln" pathLength="1" style="filter:none"/>`;
  s += `<circle class="ping" cx="${X(N-1).toFixed(1)}" cy="${Y1(bal).toFixed(1)}" r="4" fill="none" stroke="${CC.line}" stroke-width="1.5"/><circle class="dot" cx="${X(N-1).toFixed(1)}" cy="${Y1(bal).toFixed(1)}" r="4" fill="${CC.line}" stroke="${CC.surf}" stroke-width="2"/>`;
  s += `<text x="${L}" y="${H-4}" class="ax">${esc(fmtDateShort(pts[0].date))}</text><text x="${W-R}" y="${H-4}" text-anchor="end" class="ax">${esc(fmtDateShort(pts[N-1].date))}</text>`;
  const step = Math.max(1, Math.ceil(N/160)), slotW = (W-L-R)/Math.max(1, Math.ceil(N/step));
  for(let i=0;i<N;i+=step){
    const j = Math.min(N-1, i+step-1), p = pts[j], x = N===1 ? L : X(i) - (W-L-R)/(N-1)/2;
    s += `<rect class="hit" x="${Math.max(L, x).toFixed(1)}" y="${T}" width="${slotW.toFixed(1)}" height="${H1+GAP+H2}"${tipAttr(money(p.bal), (p.start?'Starting balance':fmtDateShort(p.date))+(p.dd<0 ? ' · '+money(p.dd)+' from peak' : ' · at peak'))}/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Account balance and drawdown, all time">${s}</svg>
  <div class="ch-legend"><span><i class="lk" style="background:${CC.line}"></i>Balance</span><span><i class="sw" style="background:${CC.neg};opacity:.7"></i>Drawdown from peak</span></div>`;
}

/* ---- Horizontal diverging bars (HTML, so they reflow without measuring) ---- */
function hbarsHTML(rows){
  if(!rows.length) return `<div class="empty-chart">No trades taken this month.</div>`;
  const vals = rows.map(r=>r.pnl), mn = Math.min(0,...vals), mx = Math.max(0,...vals), span = (mx-mn)||1, z = (-mn)/span*100;
  return `<div class="hbars">${rows.map(r=>{
    const w = Math.abs(r.pnl)/span*100, left = r.pnl>=0 ? z : z-w, wr = r.n ? Math.round(r.w/r.n*100) : null;
    const sub = r.sub || (r.n + ' · ' + wr + '%');
    return `<div class="hb"${tipAttr(r.n ? money(r.pnl,true) : 'No trades', (r.full||r.label)+(r.n ? ' · '+r.n+' trade'+(r.n===1?'':'s')+' · '+wr+'% won' : ''))}>
      <span class="hb-l"><b>${esc(r.label)}</b><small>${esc(sub)}</small></span>
      <span class="hb-t">${mn<0?`<em style="left:${z}%"></em>`:''}${r.n && r.pnl ? `<i class="${r.pnl>=0?'p':'n'}" style="left:${left}%;width:${Math.max(w,.8)}%"></i>` : ''}</span>
      <span class="hb-v${r.n?'':' none'}">${r.n ? kfmt(r.pnl) : '—'}</span></div>`;
  }).join('')}</div>`;
}

/* ---- Calendar: compact month-to-date line ---- */
function calCumChart(ctx, W){
  const {day, n} = dailySeries(ctx.aid, ctx.y, ctx.m);
  if(!n) return `<div class="empty-chart">No trades this month yet.</div>`;
  const N = day.length, L = 42, R = 8, T = 8, PH = 96, H = T+PH+20;
  const X = i => L + (N===1 ? (W-L-R)/2 : i*(W-L-R)/(N-1));
  const cum = day.map(d=>d.cum), t = niceTicks(Math.min(0,...cum), Math.max(0,...cum), 2), a = t[0], b = t[t.length-1];
  const Y = v => T + PH - (v-a)/(b-a)*PH;
  let s = '';
  t.forEach(v=>{ s += `<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${v===0?CC.base:CC.grid}"/><text x="${L-8}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end" class="ax">${axk(v)}</text>`; });
  const pts = cum.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  s += `<path d="M${X(0).toFixed(1)},${Y(0).toFixed(1)}L${pts.join('L')}L${X(N-1).toFixed(1)},${Y(0).toFixed(1)}Z" fill="${CC.line}" fill-opacity=".10" class="ar"/>`;
  s += `<polyline points="${pts.join(' ')}" fill="none" stroke="${CC.line}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="ln" pathLength="1"/>`;
  day.forEach((d,i)=>{ if(d.n) s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(d.cum).toFixed(1)}" r="3" class="dot" fill="${pcol(d.pnl)}" stroke="${CC.surf}" stroke-width="1.5"/>`; });
  s += `<text x="${L}" y="${H-4}" class="ax">1 ${monT(ctx.m)}</text><text x="${W-R}" y="${H-4}" text-anchor="end" class="ax">${N} ${monT(ctx.m)}</text>`;
  const slot = (W-L-R)/N;
  day.forEach((d,i)=>{ s += `<rect class="hit" x="${(X(i)-slot/2).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${PH}"${tipAttr(money(d.cum,true), 'Month to date · '+(i+1)+' '+monT(ctx.m)+(d.n ? ' · '+money(d.pnl,true)+' that day' : ''))}/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Month-to-date PnL">${s}</svg>`;
}

/* ---- KPI tiles ---- */
function sparkSVG(day){

  const pts = c.map((v,i)=>`${(N===1?0:i/(N-1)*100).toFixed(2)},${(26-(v-mn)/sp*24).toFixed(2)}`);

}
function kpiHTML(o){
  const seg = parts => `<div class="segbar">${parts.filter(p=>p.v>0).map(p=>`<i style="flex:${p.v};background:${p.c}"></i>`).join('') || '<i style="flex:1;background:var(--s3)"></i>'}</div>`;
  const avgW = o.wins ? o.grossW/o.wins : 0, avgL = o.losses ? o.grossL/o.losses : 0, ratio = avgL ? avgW/avgL : null, mxA = Math.max(avgW, avgL) || 1;
  return `<div class="kpis">
    <div class="kpi"><div class="k">Net PnL · ${monT(o.m)}</div><div class="v ${o.pnl>0?'pos':o.pnl<0?'neg':''}">${money(o.pnl,true)}</div>${o.n ? sparkSVG(o.day) : '<div class="kpi-empty">No trades yet</div>'}<div class="kf"><span>${o.n} trade${o.n===1?'':'s'}</span><span>${o.days} day${o.days===1?'':'s'} traded</span></div></div>
    <div class="kpi"><div class="k">Win rate</div><div class="v">${o.winrate===null?'—':o.winrate.toFixed(1)+'%'}</div>${seg([{v:o.wins,c:CC.pos},{v:o.losses,c:CC.neg},{v:o.bes,c:CC.flat}])}<div class="kf"><span><i style="background:${CC.pos}"></i>${o.wins} won</span><span><i style="background:${CC.neg}"></i>${o.losses} lost</span>${o.bes?`<span><i style="background:${CC.flat}"></i>${o.bes} BE</span>`:''}</div></div>
    <div class="kpi"><div class="k">Profit factor</div><div class="v">${o.pf===null?'—':o.pf===Infinity?'∞':o.pf.toFixed(2)}</div>${seg([{v:o.grossW,c:CC.pos},{v:o.grossL,c:CC.neg}])}<div class="kf"><span>${kfmt(o.grossW)} won</span><span>${kfmt(-o.grossL)} lost</span></div></div>
    <div class="kpi"><div class="k">Avg win ÷ avg loss</div><div class="v">${ratio===null?'—':ratio.toFixed(2)+'×'}</div>
      <div class="ab"><span>Win</span><span class="t"><i style="width:${avgW/mxA*100}%;background:${CC.pos}"></i></span><b>${avgW?kfmt(avgW):'—'}</b></div>
      <div class="ab"><span>Loss</span><span class="t"><i style="width:${avgL/mxA*100}%;background:${CC.neg}"></i></span><b>${avgL?kfmt(-avgL):'—'}</b></div></div>
  </div>`;
}

/* ---- motion: brief .anim class on a view; numbers count up ---- */
const REDUCED = window.matchMedia('(prefers-reduced-motion:reduce)');
let animT = 0;
function countUp(root){
  root.querySelectorAll('.kpi .v, .hist-sum b').forEach(el=>{
    if(el.children.length) return;
    const m = el.textContent.match(/^([^\d]*)([\d,]+(?:\.\d+)?)(.*)$/); if(!m) return;
    const end = parseFloat(m[2].replace(/,/g,'')), dec = (m[2].split('.')[1]||'').length, final = el.textContent, t0 = performance.now(), D = 700;
    const step = t => { const k = Math.min(1, (t-t0)/D), e = 1-Math.pow(1-k,3);
      el.textContent = k>=1 ? final : m[1] + (end*e).toLocaleString('en-US',{minimumFractionDigits:dec, maximumFractionDigits:dec}) + m[3];
      if(k<1 && el.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function animView(v){
  if(!v || REDUCED.matches) return;
  v.classList.remove('anim'); void v.offsetWidth; v.classList.add('anim');
  clearTimeout(animT); animT = setTimeout(()=> v.classList.remove('anim'), 1700);
  countUp(v);
}

function monthlyBarsSVG(aid, y, m){
  const buckets = [];
  for(let i=5;i>=0;i--){
    let mm = m-i, yy = y;
    while(mm<0){ mm+=12; yy--; }
    const pnl = monthTrades(aid,yy,mm).reduce((s,t)=>s+tradePnl(t),0);
    buckets.push({label:MONTHS_S[mm], pnl});
  }
  if(buckets.every(b=>b.pnl===0)) return `<div class="empty-chart">Nothing booked in the last 6 months.</div>`;
  const W=320,H=150,padT=10,padB=22;
  const maxAbs = Math.max(...buckets.map(b=>Math.abs(b.pnl))) || 1;
  const zero = padT + (H-padT-padB)/2;
  const scale = (H-padT-padB)/2 / maxAbs;
  const bw = 26, gap = (W - buckets.length*bw)/(buckets.length+1);
  let bars='', labels='';
  buckets.forEach((b,i)=>{
    const x = gap + i*(bw+gap);
    const h = Math.max(Math.abs(b.pnl)*scale, b.pnl!==0?3:0);
    const yPos = b.pnl>=0 ? zero-h : zero;
    const col = b.pnl>0?'#35d39a':b.pnl<0?'#ff6b6b':'rgba(255,255,255,.12)';
    if(b.pnl===0) bars += `<rect x="${x}" y="${zero-1.5}" width="${bw}" height="3" rx="1" fill="rgba(255,255,255,.12)"/>`;
    else bars += `<rect x="${x}" y="${yPos.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="1.5" fill="${col}"/>`;
    labels += `<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="9" fill="#6a727c" font-weight="500" font-family="Inter,sans-serif">${b.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" aria-label="Monthly PnL bars">
    <line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="rgba(255,255,255,.10)" stroke-dasharray="2 4"/>
    ${bars}${labels}
  </svg>`;
}

/* Journal checks run when you tap Save, so typos and a wrong Buy/Sell are fixed before Saturday's report.
   Analysis logs, and logs with no Plan line, are not checked. */
const MAX_SL = 50;
function journalIssues(f){
  const isLog = f.kind==='missed';
  if(isLog && f.reason==='analysis') return [];
  const notes = f.notes || '';
  const hasPlan = lineOf(notes,'(?:Plan|P)')!==null, resLine = lineOf(notes,'(?:Result|E)');
  if(isLog && !hasPlan) return [];
  const layers = f.entries.filter(e=>e.str!=='' && !isNaN(parseFloat(e.str))).map(e=> e.sign*parseFloat(e.str));
  const pj = parseJournal({ notes, asset:f.asset, direction:f.direction, layers });
  const out = [];
  const sgn = n => (n>0?'+':n<0?'−':'') + Math.abs(n);
  if(pj.problem) out.push(pj.problem);
  if(!hasPlan) out.push('No Plan line. Write it like: Plan: 4002.3 SL30 TP60');
  else {
    if(pj.entry===null) out.push('Plan has no entry price');
    if(pj.slPips===null) out.push('Plan has no SL (in pips, e.g. SL30)');
    if(pj.tpPips===null) out.push('Plan has no TP (in pips, e.g. TP60)');
  }
  if(pj.slPips!==null && pj.slPips>MAX_SL && pj.slPips<1000) out.push('SL'+pj.slPips+' is over your '+MAX_SL+'-pip max');
  /* a log only needs a full Result once you've started writing one */
  const resStarted = resLine!==null && /\d/.test(resLine);
  if(!isLog || resStarted){
    if(resLine===null) out.push('No Result line');
    else {
      if(pj.bestPips===null) out.push('Result has no Best (e.g. Best+40)');
      if(pj.worstPips===null) out.push('Result has no Worst (e.g. Worst-7)');
      if(pj.exitPrice===null && !pj.problem) out.push('Result has no exit price (e.g. out4002.3)');
    }
  }
  if(pj.beAtPips!==null && pj.bestPips!==null && pj.beAtPips > pj.bestPips) out.push('BE@'+pj.beAtPips+' but Best is only +'+pj.bestPips+': price never got that far');
  /* wrong Buy/Sell: the money and the journal disagree on which way the trade went */
  const pnl = layers.reduce((a,b)=>a+b,0);
  if(!pj.problem && pj.exitPips!==null && Math.abs(pj.exitPips)>=3 && layers.length && Math.abs(pnl)>=0.5 && Math.sign(pnl)!==Math.sign(pj.exitPips))
    out.push('PnL is '+(pnl>0?'+':'−')+'$'+Math.abs(Math.round(pnl*100)/100)+' but entry '+pj.entry+' to exit '+pj.exitPrice+' as a '+(f.direction==='sell'?'Sell':'Buy')+' is '+sgn(pj.exitPips)+' pips. Check Buy/Sell and the prices');
  if(!isLog && f.date >= '2026-10-27'){
    const al = lineOf(notes,'Align'), db = lineOf(notes,'Doubt');
    if(al===null || !al.trim()) out.push('Align line is empty: write the level(s) it lines up with, or none');
    if(db===null || !db.trim()) out.push('Doubt line is empty: write yes or no');
  }
  return out;
}
/* Trade number inside its Monday–Sunday week, oldest first: the same #n the weekly report uses */
function tradeWeekNo(t){
  const [y,m,d] = t.date.split('-').map(Number);
  const day = new Date(Date.UTC(y,m-1,d)); const off = (day.getUTCDay()+6)%7;
  const mon = new Date(day); mon.setUTCDate(day.getUTCDate()-off);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate()+6);
  const a = mon.toISOString().slice(0,10), b = sun.toISOString().slice(0,10);
  const wk = S.trades.filter(x=> x.date>=a && x.date<=b)
    .sort((p,q)=> p.date===q.date ? whenTs(p)-whenTs(q) : (p.date<q.date?-1:1));
  return wk.indexOf(t)+1;
}
const calcNet = f => f.entries.reduce((s,e)=> s + (e.sign * (parseFloat(e.str)||0)), 0);
const calcExpr = f => f.entries.map((e,i)=>{
  const num = e.str==='' ? (i===f.entries.length-1 ? '…' : '0') : e.str;
  if(i===0) return (e.sign<0?'−':'') + num;
  return (e.sign<0?' − ':' + ') + num;
}).join('');

/* ---------- Combos: Level + Entry (refinement belongs to the level), ranked by estimated R ---------- */
const COMBO_K = 10;     /* trades of "pull" toward your overall average */
const COMBO_Z = 2.5;    /* strictness for Edge / Leak (stricter than 2 because many combos are checked) */
const COMBO_MIN = 10;   /* no verdict below this many trades with R */
const fmtR = v => v===null || !isFinite(v) ? '—' : (v>0?'+':v<0?'−':'') + Math.abs(v).toFixed(2) + 'R';
const rColor = v => v===null ? 'var(--ink-dim)' : v>0.005 ? 'var(--green)' : v<-0.005 ? 'var(--red)' : 'var(--ink-dim)';
function comboParts(t){
  const of = g => (t.tags||[]).filter(tg=>tagGroup(tg)===g);
  const L = of('level'), E = of('entry'), R = of('refine');
  if(L.length!==1 || E.length!==1 || R.length>1) return null;
  return { level:L[0], refine:R[0]||null, entry:E[0], id:L[0]+' + '+E[0] };
}
function tradeR(t){ const r = parseJournal(t).r.exit; return (r===null || !isFinite(r)) ? null : r; }
function comboStats(list){
  const rs = []; const combos = {}; let skipped = 0; const needsFix = [];
  list.forEach(t=>{
    const pj = parseJournal(t);
    if(pj.problem) needsFix.push(t);
    const r = (pj.r.exit===null || !isFinite(pj.r.exit)) ? null : pj.r.exit;
    if(r!==null) rs.push(r);
    const p = comboParts(t);
    if(!p){ skipped++; return; }
    const c = combos[p.id] = combos[p.id] || { id:p.id, level:p.level, entry:p.entry, n:0, w:0, l:0, be:0, pnl:0, rs:[], refined:0 };
    c.n++; c.pnl += tradePnl(t);
    if(p.refine) c.refined++;
    const k = classify(t); if(k==='win') c.w++; else if(k==='loss') c.l++; else c.be++;
    if(r!==null) c.rs.push(r);
  });
  const mean = a => a.reduce((s,x)=>s+x,0)/a.length;
  const g = rs.length ? mean(rs) : 0;
  const sd = rs.length>1 ? Math.sqrt(rs.reduce((s,x)=>s+(x-g)*(x-g),0)/(rs.length-1)) : 1;
  const rows = Object.values(combos).map(c=>{
    c.nR = c.rs.length;
    c.rawR = c.nR ? mean(c.rs) : null;
    c.adjR = c.nR ? (c.nR*c.rawR + COMBO_K*g)/(c.nR + COMBO_K) : null;
    const se = (sd||1)/Math.sqrt(c.nR||1);
    c.verdict = c.nR>=COMBO_MIN ? (c.rawR - COMBO_Z*se > 0 ? 'edge' : (c.rawR + COMBO_Z*se < 0 ? 'leak' : null)) : null;
    return c;
  }).sort((a,b)=> (a.adjR===null) - (b.adjR===null) || (b.adjR??0) - (a.adjR??0) || b.n - a.n);
  return { rows, avgR:g, withR:rs.length, total:list.length, skipped, needsFix };
}
/* How one part of a combo does across all your trades */
function partStat(list, group, key){
  const match = list.filter(t=>{
    const inG = (t.tags||[]).filter(tg=>tagGroup(tg)===group);
    return key===null ? inG.length===0 : inG.includes(key);
  });
  const rs = match.map(tradeR).filter(r=>r!==null);
  return { n:match.length, nR:rs.length, avgR: rs.length ? rs.reduce((s,x)=>s+x,0)/rs.length : null };
}

function openComboSheet(id, opts){

    </div>
    ${splitRows.length ? `<div class="section-label" style="margin:14px 0 8px">Refined or not, in this combo</div>

    <p style="font-size:.7rem;color:var(--ink-faint);margin-top:2px">Own averages with no adjustment. Only compare once each side has a real sample.</p></div>` : ''}
    <div class="section-label" style="margin:0 0 8px">Each part across all your trades</div>
