    netEl.style.color = n>0?'var(--green)':n<0?'var(--red)':'var(--ink)';
    el.querySelector('#k-expr').textContent = calcExpr(f);
  };

  el.querySelector('#f-date').onchange = e=>{ f.date = e.target.value || todaySGT(); f.whenTouched = true; };
  el.querySelector('#f-time').onchange = e=>{ f.time = e.target.value || ''; f.whenTouched = true; };
  el.querySelector('#f-tpl').onclick = ()=>{
    const tpl = noteTemplate();
    if(!f.notes.trim()) f.notes = tpl;
    else if(!/^\s*(P|Plan)\s*:/im.test(f.notes)) f.notes = tpl + '\n' + f.notes;
    renderAdd();
    setTimeout(()=>{ const t = document.getElementById('f-notes'); if(t){ t.focus(); t.setSelectionRange(6,6); } }, 40);
  };
  el.querySelector('#f-legend').onclick = openLegendSheet;

  const ta = el.querySelector('#f-notes');
  const growTa = ()=>{ ta.style.height='auto'; ta.style.height = Math.max(84, Math.min(ta.scrollHeight, 340)) + 'px'; };
  ta.oninput = e=>{ f.notes = e.target.value; growTa(); };
  growTa();
  el.querySelector('#f-save').onclick = saveTrade;
  const delBtn = el.querySelector('#f-delete');
  if(delBtn) delBtn.onclick = ()=> confirmSheet(missed?'Delete this entry?':'Delete this trade?', missed?'This removes the log and its screenshots. This can\'t be undone.':'This removes it from your journal and stats. This can\'t be undone.',()=>{
    const dest = UI.returnTo||'history';
    const orig = entryById(f.editingId);
    S.trades = S.trades.filter(t=>t.id!==f.editingId); S.missed = S.missed.filter(t=>t.id!==f.editingId);
    if(orig) forgetImages(orig.images);
    save(); UI.form=null; UI.returnTo=null; toast(missed?'Entry deleted':'Trade deleted');
    leaveEdit(dest);
  });
}
function saveTrade(){
  const f = UI.form;
  if(!f) return; /* guard: double-tap after save already cleared the form */
  if(f.imgBusy) return toast('Wait for the screenshots to finish adding');
  if(!f.accountId) return toast('Pick an account');
  if(!f.asset) return toast('Pick an asset');
  const missed = f.kind==='missed';
  const layers = f.entries.filter(e=>e.str!=='' && !isNaN(parseFloat(e.str))).map(e=> e.sign*parseFloat(e.str));
  if(!missed && !layers.length) return toast('Enter the PnL on the calculator');
  const issues = missed ? [] : tagIssues(f.tags);
  if(issues.length && !f.tagsConfirmed){
    return askSheet('Save with '+issues.join(' and ')+'?',
      'The weekly report will list this trade as a tagging error. Go back to fix it, or save it as it is.',
      'Save anyway', ()=>{ f.tagsConfirmed = true; saveTrade(); });
  }
  /* the entry may have been removed on another device while this form was open */
  const orig = f.editingId ? entryById(f.editingId) : null;
  const stamp = Date.now();
  const rec = {
    id: orig ? orig.id : uid(),
    accountId: f.accountId, asset: f.asset, direction: f.direction,
    layers, tags: f.tags||[], notes: f.notes.trim(), date: f.date || todaySGT(), time: validTime(f.time) ? f.time : null,
    images: [...(f.images||[])],
    createdAt: orig ? (orig.createdAt || stamp) : stamp,
    updatedAt: stamp
  };
  if(missed){ rec.missed = true; rec.reason = f.reason || null; }
  const fromArr = orig ? (orig.missed ? S.missed : S.trades) : null;
  const toArr = missed ? S.missed : S.trades;
  if(orig && fromArr===toArr) toArr[toArr.indexOf(orig)] = rec;
  else { if(orig) fromArr.splice(fromArr.indexOf(orig), 1); toArr.push(rec); }
  if(orig) forgetImages((orig.images||[]).filter(id=>!rec.images.includes(id)));
  const dest = f.editingId ? (UI.returnTo||'history') : 'calendar';
  if(missed) toast(orig ? 'Entry updated' : 'Log saved');
  else toast(orig ? 'Trade updated' : 'Trade saved · ' + money(tradePnl(rec),true));
  save(); UI.form = null; UI.returnTo = null;
  leaveEdit(dest);
}
/* Opened from a list: step Back so the list (and its sheet) come back in place.
   New trade: replace the Add step with the destination tab. */
function leaveEdit(dest){
  if(UI.editBack && UI.tab==='add'){ UI.editBack = false; history.back(); return; }
  UI.editBack = false;
  history.replaceState({tab:dest}, '', '#'+dest); nav(dest, true);
}

/* ============================================================
   RENDER: HISTORY
   ============================================================ */
function renderHistory(){
  const el = document.getElementById('view-history');
  if(!S.accounts.length){ el.innerHTML = emptyOnboard(); return; }
  const fid = UI.historyFilter;
  const ftag = UI.historyTag || 'all';
  const hk = UI.historyKind || 'trades';
  const source = hk==='missed' ? S.missed : S.trades;
  let all = [...source].sort((a,b)=> a.date===b.date ? (whenTs(b)-whenTs(a)) : (a.date<b.date?1:-1));
  if(fid!=='all') all = all.filter(t=>t.accountId===fid);
  if(ftag!=='all') all = all.filter(t=> (t.tags||[]).includes(ftag));

  /* paginate, extending to the end of the last shown day so daily totals stay accurate */
  const limit = UI.historyLimit || 150;
  let trades = all.slice(0, limit);
  while(trades.length && trades.length < all.length && all[trades.length].date === trades[trades.length-1].date){
    trades.push(all[trades.length]);
  }
  const older = all.length - trades.length;

  let listHtml = '';
  if(!trades.length){
    listHtml = hk==='missed'
      ? `<div class="empty-state">${I.eye}<p><b>${S.missed.length?'No logs match this filter.':'No logs yet.'}</b><br>${S.missed.length?'Try a different account or tag.':'To log a setup for forward testing or analysis, open Add entry and switch to Log.'}</p></div>`
      : `<div class="empty-state">${I.book}<p><b>${S.trades.length?'No trades match this filter.':'Nothing on record.'}</b><br>${S.trades.length?'Try a different account or tag.':'The journal starts with the next trade you take.'}</p></div>`;
  } else {
    let curDay = null;
    for(const t of trades){
      if(t.date !== curDay){
        curDay = t.date;
        const dayTrades = trades.filter(x=>x.date===curDay);
        if(hk==='missed') listHtml += `<div class="day-head"><span>${relDay(curDay)}</span><span style="color:var(--gold-1)">${dayTrades.length} log${dayTrades.length===1?'':'s'}</span></div>`;
        else {
          const dayPnl = dayTrades.reduce((s,x)=>s+tradePnl(x),0);
          listHtml += `<div class="day-head"><span>${relDay(curDay)}</span><span class="dp" style="color:${dayPnl>0?'var(--green-deep)':dayPnl<0?'var(--red-deep)':'inherit'}">${money(dayPnl,true)}</span></div>`;
        }
      }
      const a = acct(t.accountId);
      const meta = [S.accounts.length>1 ? esc(a?a.name:'Deleted account') : '', (t.layers||[]).length>1 && !t.missed ? t.layers.length+' layers' : ''].filter(Boolean).join(' · ');
      listHtml += tradeRowHTML(t, meta);
    }
  }

  el.innerHTML = `
  <h2 style="font-size:1.3rem;margin:4px 2px 14px">History</h2>
  <div class="kind-seg" role="group" aria-label="Show" style="margin:0 0 12px">
    <button data-hk="trades" class="${hk==='trades'?'on':''}" aria-pressed="${hk==='trades'}">Trades · ${S.trades.length}</button>
    <button data-hk="missed" class="missed ${hk==='missed'?'on':''}" aria-pressed="${hk==='missed'}">Logs · ${S.missed.length}</button>
  </div>
  ${S.accounts.length>1?`<div class="filter-scroll">
    <button class="select-chip ${fid==='all'?'on':''}" data-f="all">All accounts</button>
    ${S.accounts.map(a=>`<button class="select-chip ${fid===a.id?'on':''}" data-f="${a.id}">${esc(a.name)}</button>`).join('')}
  </div>`:''}
  ${S.tags.length?`<div class="filter-scroll" style="margin-top:6px">
    <button class="select-chip ${ftag==='all'?'on':''}" data-t="all">All tags</button>
    ${S.tags.map(tg=>`<button class="select-chip ${ftag===tg?'on':''}" data-t="${esc(tg)}">${esc(tg)}</button>`).join('')}
  </div>`:''}
  ${listHtml}
  ${older>0?`<button class="btn-soft" id="h-more" style="width:100%;margin-top:8px">Show older · ${older} more ${hk==='missed'?'entr'+(older===1?'y':'ies'):'trade'+(older===1?'':'s')}</button>`:''}`;
  el.querySelectorAll('[data-hk]').forEach(b=> b.onclick = ()=>{ UI.historyKind = b.dataset.hk; UI.historyLimit = 150; renderHistory(); });

  el.querySelectorAll('.filter-scroll').forEach(row=>{
    row.onclick = e=>{
      const bf=e.target.closest('[data-f]'); if(bf){ UI.historyFilter=bf.dataset.f; UI.historyLimit=150; renderHistory(); return; }
      const bt=e.target.closest('[data-t]'); if(bt){ UI.historyTag=bt.dataset.t; UI.historyLimit=150; renderHistory(); }
    };
  });
  const more = el.querySelector('#h-more');
  if(more) more.onclick = ()=>{ const keep = window.scrollY; UI.historyLimit = (UI.historyLimit||150) + 150; renderHistory(); window.scrollTo({top:keep}); };
  el.querySelectorAll('.trade-row').forEach(r=> r.onclick = ()=>{
    const t = entryById(r.dataset.id); if(!t) return;
    UI.form = formFromTrade(t);
    UI.returnTo = 'history';
    UI.returnScroll = window.scrollY;
    UI.editBack = true;
    nav('add');
  });
}

const backdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('sheet');
/* Back-button model
   - Opening a sheet adds one history step ({tab, sheet:1}).
   - Closing it any way (back, swipe, tap outside, a button) removes that step with history.back().
     Anything that must happen after closing (opening another sheet, changing tab) is passed
     to closeSheet(then) and runs once the step is gone, so history never gets out of order.
   - Opening a trade from a sheet keeps the sheet's step underneath. Coming back re-opens the
     sheet on that same step (reopen with noPush) instead of adding a new one. */
let sheetClosing = false, afterSheetClose = null;
function openSheet(html, opts){
  sheetEl.innerHTML = '<div class="grab" aria-hidden="true"></div>'+html;
  sheetEl.scrollTop = 0;
  sheetEl.style.transform = '';
  backdrop.classList.add('open');
  if(!(opts && opts.noPush)) history.pushState({tab:UI.tab, sheet:1}, '', '#'+UI.tab);
}
function domCloseSheet(){ backdrop.classList.remove('open'); }
function closeSheet(then){
  if(sheetClosing) return;
  const fn = typeof then === 'function' ? then : null;
  domCloseSheet();
  if(history.state && history.state.sheet){
    sheetClosing = true; afterSheetClose = fn;
    history.back();
  } else if(fn) fn();
}
/* Leave a sheet for another screen, keeping the sheet's history step so Back returns to it */
function leaveSheetFor(tab, reopen){
  domCloseSheet();
  UI.reopen = reopen || null;
  nav(tab);
}
backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeSheet(); });

/* Swipe down to close. Drags from the handle always work; drags on the content work
   when the list is scrolled to the top, so scrolling a long list still scrolls. */
(function(){
  let startY = null, lastY = 0, lastT = 0, dy = 0, vel = 0, dragging = false, fromGrab = false;
  sheetEl.addEventListener('touchstart', e=>{
    if(!backdrop.classList.contains('open') || e.touches.length !== 1){ startY = null; return; }
    fromGrab = !!e.target.closest('.grab');
    if(!fromGrab && sheetEl.scrollTop > 0){ startY = null; return; }
    startY = lastY = e.touches[0].clientY; lastT = e.timeStamp; dy = 0; vel = 0; dragging = false;
  }, {passive:true});
  sheetEl.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const y = e.touches[0].clientY, d = y - startY;
    if(!dragging){
      if(d > 6 && (fromGrab || sheetEl.scrollTop <= 0)){ dragging = true; sheetEl.style.transition = 'none'; }
      else if(d < -6 && !fromGrab){ startY = null; return; }
      else return;
    }
    e.preventDefault();
    dy = Math.max(0, d);
    const dt = Math.max(1, e.timeStamp - lastT);
    vel = (y - lastY) / dt; lastY = y; lastT = e.timeStamp;
    sheetEl.style.transform = 'translateY(' + dy + 'px)';
    backdrop.style.opacity = String(Math.max(.35, 1 - dy / (sheetEl.offsetHeight * 1.2)));
  }, {passive:false});
  const end = ()=>{
    if(startY === null) return;
    startY = null;
    if(!dragging) return;
    dragging = false;
    sheetEl.style.transition = '';
    backdrop.style.opacity = '';
    if(dy > Math.min(120, sheetEl.offsetHeight * .25) || vel > .5){
      sheetEl.style.transform = 'translateY(100%)';
      closeSheet();
      setTimeout(()=>{ sheetEl.style.transform = ''; }, 260);
    } else {
      sheetEl.style.transform = '';
    }
  };
  sheetEl.addEventListener('touchend', end);
  sheetEl.addEventListener('touchcancel', end);
})();

/* ---------- journal parser (P / E / Post lines) ---------- */
function lineOf(notes, key){
  const m = String(notes||'').match(new RegExp('^\\s*'+key+'\\s*:\\s*(.*)$','im'));
  return m ? m[1].trim() : null;
}
const numOr = (m, i=1) => m ? parseFloat(m[i]) : null;
function parseJournal(t){
  const notes = t.notes || '';
  const warn = [];
  const unComma = x => x===null ? null : x.replace(/(\d),(?=\d{3}\b)/g, '$1');
  const P = unComma(lineOf(notes,'(?:Plan|P)')), E = unComma(lineOf(notes,'(?:Result|E)')), AfterL = lineOf(notes,'(?:After|Post)');
  let entry=null, slPips=null, tpPips=null;
  if(P){
    slPips = numOr(P.match(/SL\s*(\d+(?:\.\d+)?)/i));
    tpPips = numOr(P.match(/TP\s*(\d+(?:\.\d+)?)/i));
    entry = numOr(P.replace(/(SL|TP)\s*\d+(?:\.\d+)?/ig,'').match(/(\d{3,}(?:\.\d+)?)/));
    if(entry===null) warn.push('Plan: no entry price');
    if(slPips===null) warn.push('Plan: no SL');
    if(tpPips===null) warn.push('Plan: no TP');
  } else warn.push('no Plan line');
  let bestPips=null, worstPips=null, exitPrice=null, beAtPips=null;
  if(E){
    bestPips = numOr(E.match(/Best\s*\+?\s*(\d+(?:\.\d+)?)/i));
    const w = numOr(E.match(/Worst\s*-?\s*(\d+(?:\.\d+)?)/i));
    worstPips = w===null ? null : -Math.abs(w);
    exitPrice = numOr(E.match(/\bout\s*@?\s*(\d{3,}(?:\.\d+)?)/i));
    beAtPips = numOr(E.match(/BE\s*@\s*(\d+(?:\.\d+)?)/i));
    if(bestPips===null) warn.push('Result: no Best');
    if(worstPips===null) warn.push('Result: no Worst');
    if(exitPrice===null) warn.push('Result: no exit price');
  } else warn.push('no Result line');
  let after = null;
  if(AfterL){
    const pm = AfterL.match(/^(SL|TP|none)\b/i);
    after = pm ? (pm[1].toLowerCase()==='none' ? 'none' : pm[1].toUpperCase()) : AfterL;
  }
  const pip = PIP_SIZE[String(t.asset||'').toUpperCase()] || null;
  const dir = t.direction==='sell' ? -1 : 1;
  const r2 = n => n===null||!isFinite(n) ? null : Math.round(n*100)/100;
  const exitPips = (pip && entry!==null && exitPrice!==null) ? r2((exitPrice-entry)*dir/pip) : null;
  let problem = null;
  const shortOut = (E && exitPrice===null) ? E.match(/\bout\s*@?\s*(\d{1,2}(?:\.\d+)?)\b/i) : null;
  if(shortOut) problem = '"out '+shortOut[1]+'" isn\'t a price. Write the exit price, e.g. out4307.5';
  else if(slPips!==null && slPips>=1000) problem = 'SL '+slPips+' looks like a price. Write the stop in pips, e.g. SL30';
  else if(entry!==null && exitPrice!==null && Math.abs(exitPrice-entry)/entry > 0.05)
    problem = 'Entry '+entry+' and exit '+exitPrice+' are too far apart. Check both prices for a typo';
  else if(exitPips!==null && bestPips!==null && worstPips!==null && slPips){
    const tol = Math.max(5, slPips*0.15);
    if(exitPips > bestPips + tol || exitPips < worstPips - tol)
      problem = 'Exit works out to '+(exitPips>0?'+':'')+exitPips+' pips, outside Best+'+bestPips+' / Worst'+worstPips+'. Check the entry, exit and direction';
  }
  if(problem) warn.push(problem);
  const hasSL = slPips!==null && slPips>0 && !problem;
  const layered = (t.layers||[]).length>1;
  if(layered && exitPips!==null) warn.push('layered: exitR covers the Plan entry only');
  return {
    entry, slPips, tpPips,
    stopPrice: (pip && entry!==null && hasSL) ? r2(entry - dir*slPips*pip) : null,
    plannedRR: (hasSL && tpPips!==null) ? r2(tpPips/slPips) : null,
    bestPips, worstPips, exitPrice, exitPips, beAtPips, after,
    r: {
      exit: hasSL && exitPips!==null ? r2(exitPips/slPips) : null,
      best: hasSL && bestPips!==null ? r2(bestPips/slPips) : null,
      worst: hasSL && worstPips!==null ? r2(worstPips/slPips) : null,
      beTrigger: hasSL && beAtPips!==null ? r2(beAtPips/slPips) : null
    },
    stopOver100: slPips!==null ? slPips>100 : null,
    problem,
    warnings: warn
  };
}

/* Weeks run Monday to Sunday, using the same local dates that trades are saved with */
const isoOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekRange(offset){
  const d = new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7) + 7*(offset||0)); /* back to Monday */
  const mon = isoOf(d); d.setDate(d.getDate()+6);
  return { from: mon, to: isoOf(d) };
}
const shortDate = iso => { const [y,m,d] = iso.split('-').map(Number); return d+' '+MONTHS_S[m-1]+(y!==new Date().getFullYear()?' '+y:''); };
function openWeeklySheet(){
  if(!S.trades.length && !S.missed.length) return toast('Nothing to report yet');
  const today = todayISO();

function statBlock(list){

    trades: list.length, wins: wins.length, losses: losses.length, breakevens: bes.length,
    winRatePct: list.length ? r2(wins.length/list.length*100) : null,
    netPnl: r2(sum(p)),

    avgLoss: losses.length ? r2(sum(losses)/losses.length) : null,
    largestWin: p.length ? r2(Math.max.apply(null,p)) : null,
    largestLoss: p.length ? r2(Math.min.apply(null,p)) : null,

  const beExits = list.filter((t,i)=> J[i].beAtPips!==null && classify(t)==='be');
  const beExitJ = beExits.map(t=> J[list.indexOf(t)]);

    tradesWithFullPlan: J.filter(j=>j.entry!==null && j.slPips!==null && j.tpPips!==null).length,
    tradesWithR: exitR.length,

function groupBlock(list, keyFn){

/* Combo = Level + Entry. Refinement is part of the level, so it doesn't split combos.

const comboKey = t => { const p = comboParts(t); if(p) return [p.id];
  return (t.tags&&t.tags.length) ? ['(tag error) '+[...t.tags].sort((a,b)=> (GROUP_ORDER[tagGroup(a)]-GROUP_ORDER[tagGroup(b)]) || a.localeCompare(b)).join(' + ')] : null; };

function tradeGroups(t){
  const of = g => (t.tags||[]).filter(tg=>tagGroup(tg)===g);

  const tf = lv ? ({M:'Monthly', W:'Weekly', D:'Daily', '4':'4H'}[lv.trim().charAt(0).toUpperCase()] || '(unrecognised)') : null;
  return {
    level: lv, entry: en, refine: R.length ? R.join(' + ') : 'none',
    levelTimeframe: tf,
    levelTier: tf ? ({Monthly:'Monthly/Weekly', Weekly:'Monthly/Weekly', Daily:'Daily/4H', '4H':'Daily/4H'}[tf] || '(unrecognised)') : null,
    levelType: lv ? (/OC$/i.test(lv) ? 'Open/Close' : /[HL]$/i.test(lv) ? 'High/Low' : '(unrecognised)') : null,

/* Minimal .zip writer: files stored as-is (screenshots are already JPEG-compressed) */
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n] = c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date(Date.now()+SGT_MS); /* file times in SGT */
  const dosT = (d.getUTCHours()<<11)|(d.getUTCMinutes()<<5)|(d.getUTCSeconds()>>1);
  const dosD = ((d.getUTCFullYear()-1980)<<9)|((d.getUTCMonth()+1)<<5)|d.getUTCDate();
  let off = 0;
  for(const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dosT,true); h.setUint16(12,dosD,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer, nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dosT,true); c.setUint16(14,dosD,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true);
    c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(c.buffer, nm);
    off += 30 + nm.length + sz;
  }
  const cSize = central.reduce((s,b)=> s + b.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cSize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, e.buffer], {type:'application/zip'});
}

function exportCSV(){
  if(!S.trades.length) return toast('No trades to export yet');
  const cols = ['Date','Time (SGT)','Account','Asset','Direction','PnL','Result','Tags','Notes'];
  const csvEsc = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  /* user-entered text: also neutralise leading =,+,-,@ so spreadsheets don't execute it as a formula */
  const csvText = v => {
    let s = String(v ?? '');
    if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return csvEsc(s);
  };
  const rows = [...S.trades]
    .sort((a,b)=> a.date===b.date ? whenTs(a)-whenTs(b) : (a.date<b.date?-1:1))
    .map(t=>{
      const p = tradePnl(t); const a = acct(t.accountId);
      const kind = classify(t);
      return [csvEsc(t.date), csvEsc(validTime(t.time)?t.time:''), csvText(a?a.name:'Deleted account'), csvText(t.asset), csvEsc(t.direction.toUpperCase()), csvEsc(p.toFixed(2)), csvEsc(kind.toUpperCase()), csvText((t.tags||[]).join('; ')), csvText(t.notes||'')].join(',');
    });
  const csv = '\ufeff' + [cols.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tradetrackr-trades-' + todayISO() + '.csv';

  toast('CSV exported · ' + S.trades.length + ' trades');
}

const DEFAULT_SYNC_URL = 'https://br-soft-king-b3su4142-ttsync.compute.c-4.ap-southeast-1.aws.neon.tech';

  if(SY.status==='offline') return { color:'var(--gold-1)', text:'Offline. Changes are saved here and upload when you’re back online.', pill:'warn', short:'Offline' };
  if(SY.status==='auth') return { color:'var(--red)', text:'Passcode rejected. Disconnect, then enter the passcode again.', pill:'err', short:'Passcode' };

async function api(path, opts){

  out.tags = union(out.tags, local.tags);
  out.tagGroups = Object.assign({}, out.tagGroups||{}, local.tagGroups||{});
  out.settings = Object.assign({}, out.settings||{}, local.settings||{});
  /* Coach notes come from the cloud, so the cloud copy wins */
  out.briefs = (remote.briefs && remote.briefs.length) ? remote.briefs : (local.briefs||[]);
  if(out.settings.defaultAccountId && !out.accounts.some(a=>a.id===out.settings.defaultAccountId)) out.settings.defaultAccountId = out.accounts[0]?.id || null;
  return normalize(out);
}
function rerenderAfterSync(){
  if(UI.statsAccountId && !acct(UI.statsAccountId)) UI.statsAccountId = null;
  if(UI.historyFilter!=='all' && !acct(UI.historyFilter)) UI.historyFilter = 'all';
  if(UI.tab!=='add') render();
}
function applyRemote(data, rev){
  const d = normalize(data); if(!d) return;
  S = d; saveLocal();
  SM.rev = rev; SM.baseIds = collectIds(S); SM.dirty = false; SM.lastSyncAt = Date.now(); saveMeta();
  rerenderAfterSync();
}
function syncChanged(){
  if(!SM.key) return;
  SM.dirty = true; saveMeta();
  clearTimeout(SY.timer); SY.timer = setTimeout(()=>syncNow(), 900);
  paintSync();
}
async function pullState(){
  const r = await api('/?known=' + SM.rev);
  if(r.status!==200 || !r.body) return badResponse(r);
  if(r.body.unchanged){ SM.lastSyncAt = Date.now(); saveMeta(); return true; }
  const rev = Number(r.body.revision)||0;
  if(rev > SM.rev && r.body.data){ applyRemote(r.body.data, rev); return true; }
  if(rev !== SM.rev){ /* the cloud copy was reset: upload ours on top */ SM.rev = rev; SM.dirty = true; saveMeta(); return pushState(); }
  SM.lastSyncAt = Date.now(); saveMeta();
  return true;
}
async function pushState(){
  for(let attempt=0; attempt<3; attempt++){
    const sent = JSON.stringify(S);
    const r = await api('/', { method:'PUT', body:{ data: JSON.parse(sent), baseRevision: SM.rev } });
    if(r.status===200 && r.body){
      SM.rev = Number(r.body.revision)||SM.rev; SM.baseIds = collectIds(JSON.parse(sent)); SM.lastSyncAt = Date.now();
      SM.dirty = JSON.stringify(S) !== sent; /* edited again while uploading */
      saveMeta();
      if(SM.dirty) SY.again = true;
      return true;
    }
    if(r.status===409 && r.body){
      /* another device saved first: combine and try again */
      if(r.body.data){ S = mergeStates(r.body.data, S, SM.baseIds); saveLocal(); rerenderAfterSync(); }
      SM.rev = Number(r.body.revision)||0; saveMeta();
      continue;
    }
    return badResponse(r);
  }
  setSyncStatus('error', 'Couldn’t combine changes. It will retry.');
  return false;
}
async function syncNow(){
  if(!SM.key) return;
  if(SY.busy){ SY.again = true; return; }
  SY.busy = true; clearTimeout(SY.timer);
  setSyncStatus('busy');
  try{
    const ok = SM.dirty ? await pushState() : await pullState();
    if(ok) setSyncStatus('ok');
    if(ok) imgSyncSoon();
  }catch(e){
    setSyncStatus('offline');
  }finally{
    SY.busy = false;
    if(SY.again && SY.status!=='auth'){ SY.again = false; setTimeout(syncNow, 60); }
  }
}

/* First connection on this device */
async function connectSync(passcode){
  passcode = (passcode||'').trim();
  if(!passcode) return toast('Enter your passcode');
  let r;
  try{ r = await api('/', { key: passcode }); }
  catch(e){ return toast('Can’t reach the sync service. Check your connection.'); }
  if(r.status===401) return toast('That passcode is wrong');
  if(r.status===429) return toast('Too many wrong tries. Wait 5 minutes.');
  if(r.status!==200 || !r.body) return toast('Sync service error ('+r.status+')');
  const cloudRev = Number(r.body.revision)||0;
  const cloud = cloudRev > 0 ? normalize(r.body.data) : null;
  const hasCloud = !!(cloud && (cloud.accounts.length || cloud.trades.length || cloud.missed.length));
  const hasLocal = !!(S.accounts.length || S.trades.length || S.missed.length);
  const start = (rev, dirty) => { SM = blankMeta(); SM.key = passcode; SM.rev = rev; SM.dirty = dirty; saveMeta(); paintSync(); };

  if(!hasCloud){
    start(cloudRev, true);
    toast(hasLocal ? 'Connected · uploading this device' : 'Connected');
    if(UI.tab==='settings') renderSettings();
    syncNow();
    return;
  }
  if(!hasLocal){
    start(cloudRev, false);
    applyRemote(cloud, cloudRev);
    setSyncStatus('ok'); toast('Connected · journal loaded'); imgSyncSoon();
    if(UI.tab==='settings') renderSettings();
    return;
  }
  /* both sides have a journal: ask */
  const cnt = d => `${d.trades.length} trade${d.trades.length===1?'':'s'}, ${d.missed.length} log${d.missed.length===1?'':'s'}, ${d.accounts.length} account${d.accounts.length===1?'':'s'}`;
  openSheet(`
    <h3>Which journal should we keep?</h3>
    <p class="desc"><b>Cloud:</b> ${cnt(cloud)}<br><b>This device:</b> ${cnt(S)}</p>
    <button class="btn-primary" id="sy-cloud" style="margin-top:4px">${I.dl}Use the cloud copy</button>
    <p class="missed-note" style="margin-bottom:6px">Replaces what’s on this device. Best if you’ve already uploaded your journal from another device.</p>
    <button class="btn-soft" id="sy-both" style="width:100%;margin-top:10px">Combine both</button>
    <p class="missed-note" style="margin-bottom:6px">Keeps every entry from both. Entries that are on both keep the newer edit.</p>
    <button class="btn-soft" id="sy-mine" style="width:100%;margin-top:10px">${I.ul}Replace the cloud with this device</button>
    <p class="missed-note">Uploads this device and overwrites the cloud copy.</p>
  `);
  document.getElementById('sy-cloud').onclick = ()=> closeSheet(()=>{ start(cloudRev,false); applyRemote(cloud, cloudRev); setSyncStatus('ok'); toast('Cloud copy loaded'); imgSyncSoon(); if(UI.tab==='settings') renderSettings(); });
  document.getElementById('sy-both').onclick = ()=> closeSheet(()=>{ S = mergeStates(cloud, S, []); saveLocal(); start(cloudRev,true); toast('Combining…'); syncNow(); render(); });
  document.getElementById('sy-mine').onclick = ()=> closeSheet(()=>{ start(cloudRev,true); toast('Uploading this device…'); syncNow(); if(UI.tab==='settings') renderSettings(); });
}

  SM = blankMeta(); saveMeta(); setSyncStatus('off');
}

/* ============================================================
   SCREENSHOTS — stored on the device (IndexedDB), copied to Neon
   ============================================================ */
const IMG_MAX_PER_ENTRY = 12;
let idbP = null;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise((res, rej)=>{
    const rq = indexedDB.open('tradetrackr-images', 1);
    rq.onupgradeneeded = ()=>{ const db = rq.result; db.createObjectStore('img', {keyPath:'id'}); db.createObjectStore('pending', {keyPath:'id'}); };
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror = ()=> rej(rq.error);
  });
  return idbP;
}
async function idbDo(store, mode, fn){
  const db = await idb();
  return new Promise((res, rej)=>{
    const tx = db.transaction(store, mode); let out;
    const r = fn(tx.objectStore(store)); if(r) r.onsuccess = ()=>{ out = r.result; };
    tx.oncomplete = ()=> res(out); tx.onerror = ()=> rej(tx.error); tx.onabort = ()=> rej(tx.error);
  });
}
const imgGet = id => idbDo('img','readonly', st=>st.get(id));
const imgPutRec = rec => idbDo('img','readwrite', st=>st.put(rec));
const imgDelRec = id => idbDo('img','readwrite', st=>st.delete(id));
const imgKeys = () => idbDo('img','readonly', st=>st.getAllKeys());
const pendAdd = id => idbDo('pending','readwrite', st=>st.put({id}));
const pendDel = id => idbDo('pending','readwrite', st=>st.delete(id));
const pendKeys = () => idbDo('pending','readonly', st=>st.getAllKeys());
const imgClearAll = async () => { await idbDo('img','readwrite', st=>st.clear()); await idbDo('pending','readwrite', st=>st.clear()); };

function bufToB64(buf){ const b = new Uint8Array(buf); let s = ''; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); }
function b64ToBuf(b64){ const s = atob(b64); const out = new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i); return out.buffer; }

/* Shrink to at most 1800px on the long side and re-save as JPEG (this also drops photo location data). */
async function compressImage(file){
  const MAX = 1800;
  let src = null, w = 0, h = 0, url = null;
  try{ src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch(e){
    url = URL.createObjectURL(file);
    src = await new Promise((res, rej)=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>rej(new Error('decode')); im.src = url; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  try{
    if(!w || !h) throw new Error('empty');
    const k = Math.min(1, MAX/Math.max(w,h));
    const cw = Math.round(w*k), ch = Math.round(h*k);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(src, 0, 0, cw, ch);
    const blob = await new Promise(res=> c.toBlob(res, 'image/jpeg', .82));
    if(!blob) throw new Error('encode');
    return { mime:'image/jpeg', buf: await blob.arrayBuffer() };
  } finally {
    if(src && src.close) src.close();
    if(url) URL.revokeObjectURL(url);
  }
}

const IMG_URLS = new Map(), IMG_DL = new Map();
async function imgDownload(id){
  if(!SM.key) return null;
  if(IMG_DL.has(id)) return IMG_DL.get(id);
  const p = (async()=>{
    try{
      const r = await api('/img/'+id);
      if(r.status!==200 || !r.body || !r.body.b64) return null;
      const rec = { id, mime:r.body.mime, buf:b64ToBuf(r.body.b64), at:Date.now() };
      await imgPutRec(rec); return rec;
    }catch(e){ return null; }
    finally{ IMG_DL.delete(id); }
  })();
  IMG_DL.set(id, p); return p;
}
async function imgURL(id){
  if(IMG_URLS.has(id)) return IMG_URLS.get(id);
  let rec = null; try{ rec = await imgGet(id); }catch(e){}
  if(!rec) rec = await imgDownload(id);
  if(!rec) return null;
  const u = URL.createObjectURL(new Blob([rec.buf], {type:rec.mime}));
  IMG_URLS.set(id, u); return u;
}

/* Delete queue: ids to remove from the cloud, kept until the delete succeeds */
const delQueue = () => { try{ return JSON.parse(localStorage.getItem('tt_img_del')||'[]'); }catch(e){ return []; } };
const setDelQueue = q => { try{ localStorage.setItem('tt_img_del', JSON.stringify(q)); }catch(e){} };
function forgetImages(ids){
  ids = (ids||[]).filter(Boolean); if(!ids.length) return;
  ids.forEach(id=>{
    imgDelRec(id).catch(()=>{}); pendDel(id).catch(()=>{});
    const u = IMG_URLS.get(id); if(u){ URL.revokeObjectURL(u); IMG_URLS.delete(id); }
  });
  if(SM.key){ const q = delQueue(); ids.forEach(id=>{ if(!q.includes(id)) q.push(id); }); setDelQueue(q); imgSyncSoon(); }
}
const referencedImages = () => { const s = new Set(); [...S.trades, ...S.missed].forEach(t=> (t.images||[]).forEach(id=>s.add(id))); return s; };

let imgSyncBusy = false, imgSyncTimer = null;
function imgSyncSoon(){ clearTimeout(imgSyncTimer); imgSyncTimer = setTimeout(imgSync, 400); }
async function imgSync(){
  if(!SM.key || imgSyncBusy) return;
  imgSyncBusy = true;
  try{
    for(const id of delQueue()){
      const r = await api('/img/'+id, {method:'DELETE'});
      if(r.status===200 || r.status===404) setDelQueue(delQueue().filter(x=>x!==id)); else break;
    }
    const refs = referencedImages();
    for(const id of await pendKeys()){
      if(!refs.has(id)) continue;
      const rec = await imgGet(id); if(!rec){ await pendDel(id); continue; }
      const r = await api('/img/'+id, {method:'PUT', body:{ mime:rec.mime, b64:bufToB64(rec.buf) }});
      if(r.status===200) await pendDel(id);
      else { if(r.status===401) setSyncStatus('auth'); break; }
    }
    /* keep recent screenshots on this device so they open offline */
    const have = new Set(await imgKeys());
    const cutoff = new Date(Date.now() - 60*86400000).toISOString().slice(0,10);
    const recent = [...S.trades, ...S.missed].filter(t=>t.date>=cutoff).sort((a,b)=> a.date<b.date?1:-1).flatMap(t=>t.images||[]).filter(id=>!have.has(id)).slice(0, 24);
    for(const id of recent) await imgDownload(id);
  }catch(e){}
  finally{ imgSyncBusy = false; if(UI.tab==='settings') paintImgCount(); }
}
async function paintImgCount(){
  const el = document.getElementById('sync-imgs'); if(!el) return;
  try{
    const refs = referencedImages();
    const pend = (await pendKeys()).filter(id=>refs.has(id)).length;
    el.textContent = refs.size + ' screenshot' + (refs.size===1?'':'s') + ' in your journal' + (SM.key && pend ? ' · ' + pend + ' waiting to upload' : '');
  }catch(e){ el.textContent = ''; }
}
/* Remove screenshots on this device that no entry uses (e.g. a form that was never saved) */
async function gcImages(){
  try{
    const keep = referencedImages();
    if(UI.form && UI.form.images) UI.form.images.forEach(id=>keep.add(id));
    for(const id of await imgKeys()) if(!keep.has(id)){ await imgDelRec(id); await pendDel(id); }
  }catch(e){}
}

/* Add picked files to the open form */
async function addFormImages(files){
  const f = UI.form; if(!f) return;
  f.images = f.images || [];
  let list = [...files].filter(x=> /^image\//.test(x.type) || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(x.name));
  const room = IMG_MAX_PER_ENTRY - f.images.length;
  if(list.length > room){ toast('Up to '+IMG_MAX_PER_ENTRY+' screenshots per entry'); list = list.slice(0, Math.max(0, room)); }
  if(!list.length) return;
  f.imgBusy = (f.imgBusy||0) + list.length; rerenderForm(f);
  for(const file of list){
    try{
      const c = await compressImage(file);
      const id = uid();
      await imgPutRec({ id, mime:c.mime, buf:c.buf, at:Date.now() });
      await pendAdd(id);
      f.images.push(id);
    }catch(e){ toast('Couldn’t read '+(file.name||'that image')); }
    f.imgBusy--; rerenderForm(f);
  }
}

/* Fill <img data-img="id"> as they scroll into view */
let imgIO = null;
function hydrateImages(root){

const V = { ids:[], i:0, open:false, closing:false };

function openViewer(ids, i){
