/* Does a trade belong in a By setup row? none=true means "has no tag in this group" */
function setupMatch(t, group, key, none){
  const inGroup = (t.tags||[]).filter(tg=>tagGroup(tg)===group);
  return none ? inGroup.length===0 : inGroup.includes(key);
}
/* One line of the journal worth reading in a list: Lesson, else Before, else the first free-text line */
function notePreview(t){
  const n = t.notes || '';
  const pick = key => { const v = lineOf(n, key); return v && v.trim() ? v.trim() : null; };
  const l = pick('(?:Lesson|L)'); if(l) return 'Lesson: '+l;
  const bf = pick('(?:Before|Pre)'); if(bf) return bf;
  const free = n.split('\n').map(x=>x.trim()).find(x=> x && !/^(Plan|P|Before|Pre|During|Result|E|After|Post|Lesson|L)\s*:/i.test(x));
  return free || '';
}
function timingBadge(t){
  const k = planTiming(t);
  return k==='planned' ? '<span class="dir-badge plan">✓ Planned</span>' : k==='hindsight' ? '<span class="dir-badge hind">⏱ Hindsight</span>' : '';
}
function tradeRowHTML(t, meta){
  const multiAsset = S.assets.length>1 || S.trades.some(x=>x.asset!==t.asset);
  let pnlHTML;
  if(validTime(t.time)) meta = [t.time, meta].filter(Boolean).join(' · ');
  if(t.missed){
    const has = (t.layers||[]).length, p = has ? tradePnl(t) : 0;
    pnlHTML = has ? `<span class="pnl ${p>0?'pos':p<0?'neg':'be'}"><small class="would">paper</small>${money(p,true)}</span>` : `<span class="pnl none">—</span>`;
    meta = [t.reason ? `<span class="reason">${esc(reasonLabel(t.reason))}</span>` : '', meta].filter(Boolean).join(' · ');
  } else {
    const p = tradePnl(t), kind = classify(t);
    const cls = kind==='win'?'pos':kind==='loss'?'neg':'be';
    pnlHTML = `<span class="pnl ${cls}">${kind==='be'?'BE':money(p,true)}${kind==='be'?'<small>'+money(p,true)+'</small>':''}</span>`;
  }
  return `<button class="trade-row ${t.missed?'missed':''}" data-id="${t.id}">

    <span class="mid">

      ${meta?`<span class="meta">${meta}</span>`:''}
      ${t.tags&&t.tags.length?`<span class="tagrow">${t.tags.map(tg=>`<span class="mini-tag">${esc(tg)}</span>`).join('')}</span>`:''}
      ${notePreview(t)?`<span class="note">${esc(notePreview(t))}</span>`:''}
      ${rowThumbs(t)}
    </span>

    ${I.chevR}
  </button>`;
}
function openSetupSheet(sel, opts){
  const aid = UI.statsAccountId, y = UI.statsY, m = UI.statsM;
  const pool = sel.range==='all' ? S.trades.filter(t=>t.accountId===aid) : monthTrades(aid, y, m);
  const trades = pool.filter(t=>setupMatch(t, sel.group, sel.key, sel.none))
    .sort((a,b)=> a.date===b.date ? (whenTs(b)-whenTs(a)) : (a.date<b.date?1:-1));
  if(!trades.length) return false;
  const w = trades.filter(t=>classify(t)==='win').length, l = trades.filter(t=>classify(t)==='loss').length, be = trades.length-w-l;
  const pnl = trades.reduce((s,t)=>s+tradePnl(t),0);
  const label = sel.none ? ({level:'No level', entry:'No entry', refine:'No refinement'}[sel.group]) : sel.key;
  openSheet(`
    <h3><span class="mini-tag sheet-tag" ${sel.none?'style="background:transparent;border:1px dashed rgba(255,255,255,.18);color:var(--ink-dim)"':''}>${esc(label)}</span><span class="sheet-range">${sel.range==='all'?'All time':MONTHS_S[m]+' '+y}</span></h3>
    <p class="desc">${trades.length} trade${trades.length===1?'':'s'} · ${w}W ${l}L ${be}BE · <b style="color:${pnl>0?'var(--green)':pnl<0?'var(--red)':'inherit'}">${money(pnl,true)}</b></p>
    <div>${trades.map(t=> tradeRowHTML(t, esc(relDay(t.date)) + (t.layers.length>1?' · '+t.layers.length+' layers':''))).join('')}</div>
  `, opts);
  sheetEl.querySelectorAll('.trade-row').forEach(r=> r.onclick = ()=>{
    const t = S.trades.find(x=>x.id===r.dataset.id); if(!t) return;
    const keep = window.scrollY, listScroll = sheetEl.scrollTop;
    UI.form = formFromTrade(t);
    UI.returnTo = 'stats';
    UI.returnScroll = keep;
    UI.editBack = true;
    leaveSheetFor('add', ()=>{ const ok = openSetupSheet(sel, {noPush:true}); if(ok) sheetEl.scrollTop = listScroll; return ok; });
  });
  return true;
}

function tagPickerHTML(f){
  /* Analysis logs are about the day, not one setup: no level or entry tags */
  if(f.kind==='missed' && f.reason==='analysis') return '';
  const chip = tg => `<button class="select-chip ${f.tags.includes(tg)?'on':''}" data-tag="${esc(tg)}">${esc(tg)}</button>`;
  const hint = h => `<span style="text-transform:none;font-weight:500;color:var(--ink-faint)">· ${h}</span>`;
  /* Refine is retired (system change 27 Oct): no row for it. A refine tag already on an old trade stays on it. */
  let h = TAG_GROUPS.filter(g=> g.key!=='refine' && S.tags.some(tg=>tagGroup(tg)===g.key)).map(g=>`
  <div class="section-label">${g.label} ${hint(g.hint)}</div>
  <div class="chips tag-group" data-group="${g.key}">
    ${S.tags.filter(tg=>tagGroup(tg)===g.key).map(chip).join('')}
  </div>`).join('');
  const oldRef = (f.tags||[]).filter(tg=>tagGroup(tg)==='refine');
  if(oldRef.length) h += `<p class="desc" style="margin:6px 2px 0;font-size:.74rem;color:var(--ink-faint)">Old refinement tag kept on this trade: <b>${oldRef.map(esc).join(', ')}</b></p>`;
  const other = S.tags.filter(tg=>tagGroup(tg)==='other');
  if(other.length) h += `
  <div class="section-label">Other tags ${hint('any')}</div>
  <div class="chips tag-group" data-group="other">
    ${other.map(chip).join('')}
  </div>`;
  return h;
}
/* Level, Entry and Refine hold one tag each: picking a new one replaces the old one. */
function toggleFormTag(f, tg){
  if(f.tags.includes(tg)){ f.tags = f.tags.filter(x=>x!==tg); return; }
  const g = tagGroup(tg);
  if(g!=='other') f.tags = f.tags.filter(x=>tagGroup(x)!==g);
  f.tags = [...f.tags, tg];
}
/* Tagging problems. Only checks a group if you have tags in it. */
function tagIssues(tags){
  const out = [];
  const inGroup = g => (tags||[]).filter(tg=>tagGroup(tg)===g).length;
  const hasGroup = g => S.tags.some(tg=>tagGroup(tg)===g);
  const L = inGroup('level'), E = inGroup('entry'), R = inGroup('refine');
  if(hasGroup('level') && L===0) out.push('no level tag');
  if(L>1) out.push(L+' level tags');
  if(hasGroup('entry') && E===0) out.push('no entry tag');
  if(E>1) out.push(E+' entry tags');
  if(R>1) out.push(R+' refinement tags');
  return out;
}

      <div class="row-btns">
        <button class="btn-soft gold" id="sh-no">Go back and fix</button>
        <button class="btn-soft" id="sh-yes" style="background:var(--s3)">Save anyway</button>
      </div>`);
    document.getElementById('sh-no').onclick = ()=> closeSheet();
    document.getElementById('sh-yes').onclick = ()=> closeSheet(()=>{ f.journalConfirmed = true; saveTrade(); });
    return;
  }
  const issues = missed ? [] : tagIssues(f.tags);
  if(issues.length && !f.tagsConfirmed){
    return askSheet('Save with '+issues.join(' and ')+'?',
      'The weekly report will list this trade as a tagging error. Go back to fix it, or save it as it is.',
      'Save anyway', ()=>{ f.tagsConfirmed = true; saveTrade(); });
  }
  /* the entry may have been removed on another device while this form was open */
  const orig = f.editingId ? entryById(f.editingId) : null;
  const stamp = Date.now();
  const openRec = (!orig && f.openId) ? (S.openTrades||[]).find(x=>x.id===f.openId) : null;
  const rec = {
    id: orig ? orig.id : (f.openId || uid()),
    accountId: f.accountId, asset: f.asset, direction: f.direction,
    layers, tags: (missed && f.reason==='analysis') ? [] : (f.tags||[]), notes: f.notes.trim(), date: f.date || todaySGT(), time: validTime(f.time) ? f.time : null,
    images: [...(f.images||[])],
    planAt: f.planAt||null, resultAt: f.resultAt||null,
    onPlan: (!missed && planFor(f.date || todaySGT())) ? (f.onPlan||null) : null, rulesOk: missed ? null : (f.rulesOk||null), confidence: missed ? null : (f.confidence||null),
    afterIds: (f.afterIds||[]).filter(id=>(f.images||[]).includes(id)),
    createdAt: orig ? (orig.createdAt || stamp) : (openRec ? (openRec.createdAt || stamp) : stamp),
    updatedAt: stamp
  };
  if(missed){ rec.missed = true; rec.reason = f.reason || null; }
  if(!orig && f.openId){
    S.trades = S.trades.filter(x=>x.id!==f.openId); S.missed = S.missed.filter(x=>x.id!==f.openId);
    S.openTrades = (S.openTrades||[]).filter(x=>x.id!==f.openId);
    if(openRec) forgetImages((openRec.images||[]).filter(id=>!rec.images.includes(id)));
  }
  const fromArr = orig ? (orig.missed ? S.missed : S.trades) : null;
  const toArr = missed ? S.missed : S.trades;
  if(orig && fromArr===toArr) toArr[toArr.indexOf(orig)] = rec;
  else { if(orig) fromArr.splice(fromArr.indexOf(orig), 1); toArr.push(rec); }
  if(orig) forgetImages((orig.images||[]).filter(id=>!rec.images.includes(id)));
  const dest = f.editingId ? (UI.returnTo||'history') : 'calendar';
  if(missed) toast(orig ? 'Entry updated' : 'Log saved');
  else toast(orig ? 'Trade updated' : 'Trade saved · ' + money(tradePnl(rec),true));
  if(!f.editingId) clearDraft();
  save(); UI.form = null; UI.returnTo = null;
  leaveEdit(dest);
}
/* Opened from a list: step Back so the list (and its sheet) come back in place.
   New trade: replace the Add step with the destination tab. */
function leaveEdit(dest){
  if(UI.editBack && UI.tab==='add'){ UI.editBack = false; history.back(); return; }
  UI.editBack = false;
  history.replaceState({tab:dest}, '', '#'+dest); nav(dest, true);
}

/* ============================================================
   RENDER: HISTORY
   ============================================================ */
function renderHistory(){
  const el = document.getElementById('view-history');
  if(!S.accounts.length){ el.innerHTML = emptyOnboard(); return; }
  const fid = UI.historyFilter;
  const ftag = UI.historyTag || 'all';
  const hk = UI.historyKind || 'trades';
  const source = hk==='missed' ? S.missed : hk==='plans' ? [] : S.trades;
  let all = [...source].sort((a,b)=> a.date===b.date ? (whenTs(b)-whenTs(a)) : (a.date<b.date?1:-1));
  if(fid!=='all') all = all.filter(t=>t.accountId===fid);
  if(ftag!=='all') all = all.filter(t=> (t.tags||[]).includes(ftag));

  /* paginate, extending to the end of the last shown day so daily totals stay accurate */
  const limit = UI.historyLimit || 150;
  let trades = all.slice(0, limit);
  while(trades.length && trades.length < all.length && all[trades.length].date === trades[trades.length-1].date){
    trades.push(all[trades.length]);
  }
  const older = all.length - trades.length;

  let listHtml = '';
  if(!trades.length){
    listHtml = hk==='missed'
      ? `<div class="empty-state">${I.eye}<p><b>${S.missed.length?'No logs match this filter.':'No logs yet.'}</b><br>${S.missed.length?'Try a different account or tag.':'To log a setup for forward testing or analysis, open Add entry and switch to Log.'}</p></div>`
      : `<div class="empty-state">${I.book}<p><b>${S.trades.length?'No trades match this filter.':'Nothing on record.'}</b><br>${S.trades.length?'Try a different account or tag.':'The journal starts with the next trade you take.'}</p></div>`;
  } else {
    let curDay = null;
    for(const t of trades){
      if(t.date !== curDay){
        curDay = t.date;
        const dayTrades = trades.filter(x=>x.date===curDay);
        if(hk==='missed') listHtml += `<div class="day-head"><span>${relDay(curDay)}</span><span style="color:var(--gold-1)">${dayTrades.length} log${dayTrades.length===1?'':'s'}</span></div>`;
        else {
          const dayPnl = dayTrades.reduce((s,x)=>s+tradePnl(x),0);
          listHtml += `<div class="day-head"><span>${relDay(curDay)}</span><span class="dp" style="color:${dayPnl>0?'var(--green-deep)':dayPnl<0?'var(--red-deep)':'inherit'}">${money(dayPnl,true)}</span></div>`;
        }
      }
      const a = acct(t.accountId);
      const meta = [S.accounts.length>1 ? esc(a?a.name:'Deleted account') : '', (t.layers||[]).length>1 && !t.missed ? t.layers.length+' layers' : ''].filter(Boolean).join(' · ');
      listHtml += tradeRowHTML(t, meta);
    }
  }

  if(hk==='plans'){
    const ps = [...(S.plans||[])].sort((a,b)=> a.date<b.date ? 1 : -1);
    listHtml = ps.length ? '<div style="margin-top:14px"></div>' + ps.map(p=>{
      const dt = S.trades.filter(t=>t.date===p.date), pnl = dt.reduce((s,t)=>s+tradePnl(t),0), sc = (p.scenarios||[]).find(x=>(x.if||'').trim());
      return `<button class="trade-row plan-row" data-plan="${esc(p.date)}"><span class="ava">${I_SUN}</span><span class="mid"><span class="sym">${esc(relDay(p.date))}${p.review && p.review.grade ? `<span class="grade g-${esc(p.review.grade)}">${esc(p.review.grade)}</span>` : (p.date<todaySGT() ? '<span class="dir-badge hind">NOT CHECKED</span>' : '')}</span><span class="meta">${esc(planSummary(p))}</span>${sc ? `<span class="note">${esc(sc.if)} → ${esc(sc.then||'…')}</span>` : ''}</span><span class="pnl ${pnl>0?'pos':pnl<0?'neg':'be'}">${dt.length ? money(pnl,true)+'<small>'+dt.length+' trade'+(dt.length===1?'':'s')+'</small>' : '<small>no trades</small>'}</span>${I.chevR}</button>`;
    }).join('') : `<div class="empty-state" style="margin-top:14px">${I_SUN}<p><b>No morning plans yet.</b><br>Open Add entry and switch to Plan, or tap "Today's plan" on the Calendar.</p></div>`;
  }
  let histSum = '';
  if(hk==='trades' && all.length){
    const net = all.reduce((s,t)=>s+tradePnl(t),0), hw = all.filter(t=>classify(t)==='win').length, hl = all.filter(t=>classify(t)==='loss').length;
    histSum = `<div class="hist-sum">
      <div><small>Trades</small><b>${all.length}</b></div>
      <div><small>Net PnL</small><b class="${net>0?'pos':net<0?'neg':''}">${money(net,true)}</b></div>
      <div><small>Win rate</small><b>${Math.round(hw/all.length*100)}%</b><span class="segbar"><i style="flex:${hw||0.0001};background:var(--green)"></i><i style="flex:${hl||0.0001};background:var(--red)"></i>${all.length-hw-hl?`<i style="flex:${all.length-hw-hl};background:var(--ink-faint)"></i>`:''}</span></div>
      <div><small>Avg trade</small><b class="${net>0?'pos':net<0?'neg':''}">${money(net/all.length,true)}</b></div>
    </div>`;
  }
  el.innerHTML = `
  <div class="page-head"><div><h2>History</h2><p>Every entry, newest first</p></div></div>
  <div class="kind-seg three" role="group" aria-label="Show" style="margin:0 0 12px;max-width:480px">
    <button data-hk="trades" class="${hk==='trades'?'on':''}" aria-pressed="${hk==='trades'}">Trades · ${S.trades.length}</button>
    <button data-hk="missed" class="missed ${hk==='missed'?'on':''}" aria-pressed="${hk==='missed'}">Logs · ${S.missed.length}</button>
    <button data-hk="plans" class="plan ${hk==='plans'?'on':''}" aria-pressed="${hk==='plans'}">Plans · ${(S.plans||[]).length}</button>
  </div>
  ${hk!=='plans' && S.accounts.length>1?`<div class="filter-scroll">
    <button class="select-chip ${fid==='all'?'on':''}" data-f="all">All accounts</button>
    ${S.accounts.map(a=>`<button class="select-chip ${fid===a.id?'on':''}" data-f="${a.id}">${esc(a.name)}</button>`).join('')}
  </div>`:''}
  ${hk!=='plans' && S.tags.length?`<div class="filter-scroll" style="margin-top:6px">
    <button class="select-chip ${ftag==='all'?'on':''}" data-t="all">All tags</button>
    ${S.tags.map(tg=>`<button class="select-chip ${ftag===tg?'on':''}" data-t="${esc(tg)}">${esc(tg)}</button>`).join('')}
  </div>`:''}
  ${hk==='trades' && (S.openTrades||[]).length ? `<div class="sub-head" style="margin-top:16px"><span>Open · not counted yet</span></div>${openStripHTML()}` : ''}
  ${histSum}
  ${listHtml}
  ${older>0?`<button class="btn-soft" id="h-more" style="width:100%;margin-top:8px">Show older · ${older} more ${hk==='missed'?'entr'+(older===1?'y':'ies'):'trade'+(older===1?'':'s')}</button>`:''}`;
  el.querySelectorAll('[data-hk]').forEach(b=> b.onclick = ()=>{ UI.historyKind = b.dataset.hk; UI.historyLimit = 150; renderHistory(); });

  el.querySelectorAll('.filter-scroll').forEach(row=>{
    row.onclick = e=>{
      const bf=e.target.closest('[data-f]'); if(bf){ UI.historyFilter=bf.dataset.f; UI.historyLimit=150; renderHistory(); return; }
      const bt=e.target.closest('[data-t]'); if(bt){ UI.historyTag=bt.dataset.t; UI.historyLimit=150; renderHistory(); }
    };
  });
  el.querySelectorAll('[data-plan]').forEach(r=> r.onclick = ()=> openDaySheet(r.dataset.plan));
  wireOpen(el);
  const more = el.querySelector('#h-more');
  if(more) more.onclick = ()=>{ const keep = window.scrollY; UI.historyLimit = (UI.historyLimit||150) + 150; renderHistory(); window.scrollTo({top:keep}); };
  el.querySelectorAll('.trade-row').forEach(r=> r.onclick = ()=>{
    const t = entryById(r.dataset.id); if(!t) return;
    UI.form = formFromTrade(t);
    UI.returnTo = 'history';
    UI.returnScroll = window.scrollY;
    UI.editBack = true;
    nav('add');
  });
}

const backdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('sheet');
/* Back-button model
   - Opening a sheet adds one history step ({tab, sheet:1}).
   - Closing it any way (back, swipe, tap outside, a button) removes that step with history.back().
     Anything that must happen after closing (opening another sheet, changing tab) is passed
     to closeSheet(then) and runs once the step is gone, so history never gets out of order.
   - Opening a trade from a sheet keeps the sheet's step underneath. Coming back re-opens the
     sheet on that same step (reopen with noPush) instead of adding a new one. */
let sheetClosing = false, afterSheetClose = null;
function openSheet(html, opts){
  sheetEl.innerHTML = '<div class="grab"><button type="button" class="sheet-x" aria-label="Close">'+I.x+'</button></div>'+html;
  sheetEl.scrollTop = 0;
  sheetEl.style.transform = '';
  backdrop.classList.add('open');
  if(!(opts && opts.noPush)) history.pushState({tab:UI.tab, sheet:1}, '', '#'+UI.tab);
}
function domCloseSheet(){ backdrop.classList.remove('open'); }
function closeSheet(then){
  if(sheetClosing) return;
  const fn = typeof then === 'function' ? then : null;
  domCloseSheet();
  if(history.state && history.state.sheet){
    sheetClosing = true; afterSheetClose = fn;
    history.back();
  } else if(fn) fn();
}
/* Leave a sheet for another screen, keeping the sheet's history step so Back returns to it */
function leaveSheetFor(tab, reopen){
  domCloseSheet();
  UI.reopen = reopen || null;
  nav(tab);
}
backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeSheet(); });
sheetEl.addEventListener('click', e=>{ if(e.target.closest('.sheet-x')) closeSheet(); });

/* Swipe down to close. Drags from the handle always work; drags on the content work
   when the list is scrolled to the top, so scrolling a long list still scrolls. */
(function(){
  let startY = null, lastY = 0, lastT = 0, dy = 0, vel = 0, dragging = false, fromGrab = false;
  sheetEl.addEventListener('touchstart', e=>{
    if(!backdrop.classList.contains('open') || e.touches.length !== 1){ startY = null; return; }
    fromGrab = !!e.target.closest('.grab');
    if(!fromGrab && sheetEl.scrollTop > 0){ startY = null; return; }
    startY = lastY = e.touches[0].clientY; lastT = e.timeStamp; dy = 0; vel = 0; dragging = false;
  }, {passive:true});
  sheetEl.addEventListener('touchmove', e=>{
    if(startY === null) return;
    const y = e.touches[0].clientY, d = y - startY;
    if(!dragging){
      if(d > 6 && (fromGrab || sheetEl.scrollTop <= 0)){ dragging = true; sheetEl.style.transition = 'none'; }
      else if(d < -6 && !fromGrab){ startY = null; return; }
      else return;
    }
    e.preventDefault();
    dy = Math.max(0, d);
    const dt = Math.max(1, e.timeStamp - lastT);
    vel = (y - lastY) / dt; lastY = y; lastT = e.timeStamp;
    sheetEl.style.transform = 'translateY(' + dy + 'px)';
    backdrop.style.opacity = String(Math.max(.35, 1 - dy / (sheetEl.offsetHeight * 1.2)));
  }, {passive:false});
  const end = ()=>{
    if(startY === null) return;
    startY = null;
    if(!dragging) return;
    dragging = false;
    sheetEl.style.transition = '';
    backdrop.style.opacity = '';
    if(dy > Math.min(120, sheetEl.offsetHeight * .25) || vel > .5){
      sheetEl.style.transform = 'translateY(100%)';
      closeSheet();
      setTimeout(()=>{ sheetEl.style.transform = ''; }, 260);
    } else {
      sheetEl.style.transform = '';
    }
  };
  sheetEl.addEventListener('touchend', end);
  sheetEl.addEventListener('touchcancel', end);
})();

async function exportData(){
  const ids = [...referencedImages()];
  const images = {}; let missing = 0;
  if(ids.length) toast('Preparing backup…');
  for(const id of ids){
    let rec = null; try{ rec = await imgGet(id); }catch(e){}
    if(!rec) rec = await imgDownload(id);
    if(rec) images[id] = { mime: rec.mime, b64: bufToB64(rec.buf) }; else missing++;
  }
  const blob = new Blob([JSON.stringify({app:'tradetrackr',version:2,exportedAt:new Date().toISOString(),data:S,images},null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tradetrackr-backup-'+todayISO()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  S.settings.lastBackupAt = Date.now(); save();
  if(UI.tab==='settings') renderSettings();
  toast(missing ? 'Backup exported · '+missing+' screenshot'+(missing===1?'':'s')+' not on this device' : 'Backup exported');
}
document.getElementById('import-file').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const j = JSON.parse(reader.result);
      const d = j.data && Array.isArray(j.data.accounts) ? j.data : (Array.isArray(j.accounts) ? j : null);
      if(!d) throw 0;
      confirmSheet('Restore this backup?', SM.key ? 'This replaces everything on this device with the backup file, and then replaces the cloud copy too.' : 'This replaces everything currently on this device with the backup file.', async ()=>{
        if(!d.settings) d.settings = {defaultAccountId:d.accounts?.[0]?.id||null, defaultAsset:'XAUUSD', beThreshold:0};
        /* keep current coach notes if the backup is older than them */
        if(!(Array.isArray(d.briefs) && d.briefs.length) && S.briefs && S.briefs.length) d.briefs = S.briefs;
        S = normalize(JSON.parse(JSON.stringify(d)));
        const imgs = j.images && typeof j.images==='object' ? j.images : {};
        for(const [id, im] of Object.entries(imgs)){
          if(!/^[a-z0-9]{6,40}$/.test(id) || !im || !im.b64) continue;
          try{ await imgPutRec({ id, mime: im.mime||'image/jpeg', buf: b64ToBuf(im.b64), at: Date.now() }); await pendAdd(id); }catch(e){}
        }
        save(); UI.statsAccountId=null; UI.historyFilter='all'; UI.form=null;
        toast('Backup restored'); nav('calendar');
      });
      // repurpose confirm button label
      const yes = document.getElementById('sh-yes'); if(yes){ yes.textContent='Restore'; yes.classList.add('gold'); }
    }catch(err){ toast('Invalid backup file'); }
    e.target.value='';
  };
  reader.readAsText(file);
});

/* ---------- journal parser (P / E / Post lines) ---------- */
function lineOf(notes, key){
  const m = String(notes||'').match(new RegExp('^\\s*'+key+'\\s*:\\s*(.*)$','im'));
  return m ? m[1].trim() : null;
}
const numOr = (m, i=1) => m ? parseFloat(m[i]) : null;
function parseJournal(t){
  const notes = t.notes || '';
  const warn = [];
  const unComma = x => x===null ? null : x.replace(/(\d),(?=\d{3}\b)/g, '$1');
  const P = unComma(lineOf(notes,'(?:Plan|P)')), E = unComma(lineOf(notes,'(?:Result|E)')), AfterL = lineOf(notes,'(?:After|Post)');
  let entry=null, slPips=null, tpPips=null;
  if(P){
    slPips = numOr(P.match(/SL\s*(\d+(?:\.\d+)?)/i));
    tpPips = numOr(P.match(/TP\s*(\d+(?:\.\d+)?)/i));
    entry = numOr(P.replace(/(SL|TP)\s*\d+(?:\.\d+)?/ig,'').match(/(\d{3,}(?:\.\d+)?)/));
    if(entry===null) warn.push('Plan: no entry price');
    if(slPips===null) warn.push('Plan: no SL');
    if(tpPips===null) warn.push('Plan: no TP');
  } else warn.push('no Plan line');
  let bestPips=null, worstPips=null, exitPrice=null, beAtPips=null;
  if(E){
    bestPips = numOr(E.match(/Best\s*\+?\s*(\d+(?:\.\d+)?)/i));
    const w = numOr(E.match(/Worst\s*-?\s*(\d+(?:\.\d+)?)/i));
    worstPips = w===null ? null : -Math.abs(w);
    exitPrice = numOr(E.match(/\bout\s*@?\s*(\d{3,}(?:\.\d+)?)/i));
    beAtPips = numOr(E.match(/BE\s*@\s*(\d+(?:\.\d+)?)/i));
    if(bestPips===null) warn.push('Result: no Best');
    if(worstPips===null) warn.push('Result: no Worst');
    if(exitPrice===null) warn.push('Result: no exit price');
  } else warn.push('no Result line');
  let after = null;
  if(AfterL){
    const pm = AfterL.match(/^(SL|TP|none)\b/i);
    after = pm ? (pm[1].toLowerCase()==='none' ? 'none' : pm[1].toUpperCase()) : AfterL;
  }
  const pip = PIP_SIZE[String(t.asset||'').toUpperCase()] || null;
  const dir = t.direction==='sell' ? -1 : 1;
  const r2 = n => n===null||!isFinite(n) ? null : Math.round(n*100)/100;
  const exitPips = (pip && entry!==null && exitPrice!==null) ? r2((exitPrice-entry)*dir/pip) : null;
  let problem = null;
  const shortOut = (E && exitPrice===null) ? E.match(/\bout\s*@?\s*(\d{1,2}(?:\.\d+)?)\b/i) : null;
  if(shortOut) problem = '"out '+shortOut[1]+'" isn\'t a price. Write the exit price, e.g. out4307.5';
  else if(slPips!==null && slPips>=1000) problem = 'SL '+slPips+' looks like a price. Write the stop in pips, e.g. SL30';
  else if(entry!==null && exitPrice!==null && Math.abs(exitPrice-entry)/entry > 0.05)
    problem = 'Entry '+entry+' and exit '+exitPrice+' are too far apart. Check both prices for a typo';
  else if(exitPips!==null && bestPips!==null && worstPips!==null && slPips){
    const tol = Math.max(5, slPips*0.15);
    if(exitPips > bestPips + tol || exitPips < worstPips - tol)
      problem = 'Exit works out to '+(exitPips>0?'+':'')+exitPips+' pips, outside Best+'+bestPips+' / Worst'+worstPips+'. Check the entry, exit and direction';
  }
  if(problem) warn.push(problem);
  const hasSL = slPips!==null && slPips>0 && !problem;
  const layered = (t.layers||[]).length>1;
  if(layered && exitPips!==null) warn.push('layered: exitR covers the Plan entry only');
  return {
    entry, slPips, tpPips,
    stopPrice: (pip && entry!==null && hasSL) ? r2(entry - dir*slPips*pip) : null,
    plannedRR: (hasSL && tpPips!==null) ? r2(tpPips/slPips) : null,
    bestPips, worstPips, exitPrice, exitPips, beAtPips, after,
    r: {
      exit: hasSL && exitPips!==null ? r2(exitPips/slPips) : null,
      best: hasSL && bestPips!==null ? r2(bestPips/slPips) : null,
      worst: hasSL && worstPips!==null ? r2(worstPips/slPips) : null,
      beTrigger: hasSL && beAtPips!==null ? r2(beAtPips/slPips) : null
    },
    stopOver100: slPips!==null ? slPips>100 : null,
    problem,
    warnings: warn
  };
}

/* Weeks run Monday to Sunday, using the same local dates that trades are saved with */
const isoOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function weekRange(offset){
  const d = new Date(); d.setHours(12,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6)%7) + 7*(offset||0)); /* back to Monday */
  const mon = isoOf(d); d.setDate(d.getDate()+6);
  return { from: mon, to: isoOf(d) };
}
const shortDate = iso => { const [y,m,d] = iso.split('-').map(Number); return d+' '+MONTHS_S[m-1]+(y!==new Date().getFullYear()?' '+y:''); };

}
function statBlock(list){
  const r2 = n => Math.round(n*100)/100;
  const sum = a => a.reduce((s,x)=>s+x,0);
  const thr = Math.abs(S.settings.beThreshold||0);
  const p = list.map(tradePnl);
  const wins = p.filter(x=>x>thr), losses = p.filter(x=>x<-thr), bes = p.filter(x=>x>=-thr&&x<=thr);
  return {
    trades: list.length, wins: wins.length, losses: losses.length, breakevens: bes.length,
    winRatePct: list.length ? r2(wins.length/list.length*100) : null,
    netPnl: r2(sum(p)),
    avgWin: wins.length ? r2(sum(wins)/wins.length) : null,
    avgLoss: losses.length ? r2(sum(losses)/losses.length) : null,
    largestWin: p.length ? r2(Math.max.apply(null,p)) : null,
    largestLoss: p.length ? r2(Math.min.apply(null,p)) : null,
    layeredTrades: list.filter(t=>(t.layers||[]).length>1).length,
    journal: rBlock(list)
  };
}
function rBlock(list){
  const r2 = n => Math.round(n*100)/100;
  const avg = a => a.length ? r2(a.reduce((s,x)=>s+x,0)/a.length) : null;
  const J = list.map(parseJournal);
  const exitR = J.map(j=>j.r.exit).filter(x=>x!==null);
  const beMoved = J.filter(j=>j.beAtPips!==null);
  const beExits = list.filter((t,i)=> J[i].beAtPips!==null && classify(t)==='be');
  const beExitJ = beExits.map(t=> J[list.indexOf(t)]);
  return {
    tradesWithFullPlan: J.filter(j=>j.entry!==null && j.slPips!==null && j.tpPips!==null).length,
    tradesWithR: exitR.length,
    netR: exitR.length ? r2(exitR.reduce((s,x)=>s+x,0)) : null,
    avgR: avg(exitR),
    avgBestR: avg(J.map(j=>j.r.best).filter(x=>x!==null)),
    avgWorstR: avg(J.map(j=>j.r.worst).filter(x=>x!==null)),
    avgPlannedRR: avg(J.map(j=>j.plannedRR).filter(x=>x!==null)),
    stopMovedToEntry: beMoved.length,
    avgBeTriggerR: avg(beMoved.map(j=>j.r.beTrigger).filter(x=>x!==null)),
    beExits: beExits.length,
    beExitsAfter: {
      SL: beExitJ.filter(j=>j.after==='SL').length,
      TP: beExitJ.filter(j=>j.after==='TP').length,
      none: beExitJ.filter(j=>j.after==='none').length,
      notLogged: beExitJ.filter(j=>j.after===null).length
    },
    stopsOver100: J.filter(j=>j.stopOver100).length,
    tradesWithWarnings: J.filter(j=>j.warnings.length).length
  };
}
function groupBlock(list, keyFn){
  const m = {};
  list.forEach(t=>{ (keyFn(t)||['(untagged)']).forEach(k=>{ (m[k]=m[k]||[]).push(t); }); });
  const out = {}; Object.keys(m).forEach(k=> out[k] = statBlock(m[k]));
  return out;
}
const GROUP_ORDER = { level:0, refine:1, entry:2, other:3 };
/* Combo name in Level + Refine + Entry order, e.g. "DL + 1R + 5mEng" */
/* Combo = Level + Entry. Refinement is part of the level, so it doesn't split combos.
   Trades with missing/doubled tags fall back to their full tag list so they stay visible. */
const comboKey = t => { const p = comboParts(t); if(p) return [p.id];
  return (t.tags&&t.tags.length) ? ['(tag error) '+[...t.tags].sort((a,b)=> (GROUP_ORDER[tagGroup(a)]-GROUP_ORDER[tagGroup(b)]) || a.localeCompare(b)).join(' + ')] : null; };
const comboRefineKey = t => { const p = comboParts(t); return p ? [p.id+' · '+(p.refine||'not refined')] : null; };
/* Broad groups, read from your tag names: M/W/D/4 prefix = timeframe, OC vs H/L = type, '>' = HTF>LTF engulf */
function tradeGroups(t){
  const of = g => (t.tags||[]).filter(tg=>tagGroup(tg)===g);
  const L = of('level'), E = of('entry'), R = of('refine');
  const lv = L.length===1 ? L[0] : null, en = E.length===1 ? E[0] : null;
  const tf = lv ? ({M:'Monthly', W:'Weekly', D:'Daily', '4':'4H'}[lv.trim().charAt(0).toUpperCase()] || '(unrecognised)') : null;
  return {
    level: lv, entry: en, refine: R.length ? R.join(' + ') : 'none',
    levelTimeframe: tf,
    levelTier: tf ? ({Monthly:'Monthly/Weekly', Weekly:'Monthly/Weekly', Daily:'Daily/4H', '4H':'Daily/4H'}[tf] || '(unrecognised)') : null,
    levelType: lv ? (/OC$/i.test(lv) ? 'Open/Close' : /[HL]$/i.test(lv) ? 'High/Low' : '(unrecognised)') : null,
    confirmationStyle: en ? (/^tap$/i.test(en) ? 'Tap' : />/.test(en) ? 'HTF>LTF engulf' : /eng/i.test(en) ? 'Single engulf' : '(unrecognised)') : null,
    refined: R.length ? 'Refined' : 'Unrefined'
  };
}
function groupedBlocks(list){
  const by = key => groupBlock(list, t => { const v = tradeGroups(t)[key]; return [v===null ? '(tag error)' : v]; });
  return {
    levelTier: by('levelTier'), levelTimeframe: by('levelTimeframe'), levelType: by('levelType'),
    confirmationStyle: by('confirmationStyle'), refined: by('refined'), refinement: by('refine')
  };
}
async function exportWeekly(from, to, withShots){

  const week = S.trades.filter(t=> t.date>=from && t.date<=to).sort(byWhen);

    const base = 'screenshots/' + [t.date, validTime(t.time) ? t.time.replace(':','') : 'notime', ((t.afterIds||[]).includes(id) ? kind+'-after' : kind),
      String(t.asset||'').replace(/[^A-Za-z0-9]+/g,'') || 'asset', t.direction, i+1].join('_');

    app:'tradetrackr', report:'weekly', version:5,
    morningPlans: 'plansThisWeek holds the morning plan written before trading each day (levels, scenarios, checklist, end-of-day check). The trader has no daily bias by design. Trades carry onPlan (part of that day\'s plan), rulesFollowed and confidence (1-5) when filled in.',
    timezone: 'Times are Singapore time (SGT, UTC+8). time is null for entries saved before times were added.',
    journalFormat: 'Plan: entry SLpips TPpips | Before | During | Result: Best+pips Worst-pips out<price> BE@<pips in profit when stop moved to entry> | After: SL/TP/none then free text | Lesson',
    generatedAt: new Date().toISOString(),

    thisWeekByCombo: groupBlock(week, comboKey),
    allTimeByCombo: groupBlock(S.trades, comboKey),
    allTimeByComboRefine: groupBlock(S.trades, comboRefineKey),
    /* Same ranking as the Stats screen, so the AI reads it instead of recalculating */
    allTimeComboRanking: (cs => ({ overallAvgR: r2(cs.avgR), tradesWithR: cs.withR, pullTrades: COMBO_K, edgeLeakZ: COMBO_Z, minTradesForVerdict: COMBO_MIN,
      combos: cs.rows.map((c,i)=>({ rank: i+1, combo: c.id, trades: c.n, tradesWithR: c.nR, ownAvgR: c.rawR===null ? null : r2(c.rawR),
        estimatedR: c.adjR===null ? null : r2(c.adjR), verdict: c.verdict==='edge' ? 'Edge' : c.verdict==='leak' ? 'Leak' : null })) }))(comboStats(S.trades)),
    logsThisWeek: weekLogs.map(t=>({

    openTradesNotCounted: (S.openTrades||[]).length,

      return { date:p.date, watching:p.assets||[], levels:levelLines(p.levels), news:p.news||'', scenarios:p.scenarios||[], checklist:(p.checklist||[]).map(c=>(c.done?'[x] ':'[ ] ')+c.text),
        notes:p.notes||'', endOfDay:p.review||null, tradesThatDay:dt.length, pnlThatDay:r2(dt.reduce((s,t)=>s+tradePnl(t),0)), screenshots: shotNames(Object.assign({}, p, {asset:'plan', direction:'day'}), 'plan') }; }),

  const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); };

    download(new Blob([txt], {type:'application/json'}), fileBase+'.json');

    return;
  }
  toast('Preparing weekly report\u2026');
  const enc = new TextEncoder(), files = [], missing = [];
  for(const sh of shots){
    let rec = null; try{ rec = await imgGet(sh.id); }catch(e){}
    if(!rec) rec = await imgDownload(sh.id);
    if(rec && rec.buf) files.push({ name: sh.name, data: new Uint8Array(rec.buf) }); else missing.push(sh.name);
  }
  if(missing.length) report.screenshotsNotIncluded = missing;
  files.unshift({ name: fileBase+'.json', data: enc.encode(JSON.stringify(report, null, 2)) });
  download(makeZip(files), fileBase+'.zip');
  const n = files.length-1;
  toast('Weekly report \u00b7 '+counts+' \u00b7 '+n+' screenshot'+(n===1?'':'s')+(missing.length ? ' ('+missing.length+' not on this device)' : '')+((await copied) ? ' \u00b7 JSON copied' : ''));
}

/* Minimal .zip writer: files stored as-is (screenshots are already JPEG-compressed) */
const CRC_T = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c = n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n] = c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date(Date.now()+SGT_MS); /* file times in SGT */
  const dosT = (d.getUTCHours()<<11)|(d.getUTCMinutes()<<5)|(d.getUTCSeconds()>>1);
  const dosD = ((d.getUTCFullYear()-1980)<<9)|((d.getUTCMonth()+1)<<5)|d.getUTCDate();
  let off = 0;
  for(const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true);
    h.setUint16(10,dosT,true); h.setUint16(12,dosD,true); h.setUint32(14,crc,true); h.setUint32(18,sz,true); h.setUint32(22,sz,true);
    h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(h.buffer, nm, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint16(10,0,true);
    c.setUint16(12,dosT,true); c.setUint16(14,dosD,true); c.setUint32(16,crc,true); c.setUint32(20,sz,true); c.setUint32(24,sz,true);
    c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(c.buffer, nm);
    off += 30 + nm.length + sz;
  }
  const cSize = central.reduce((s,b)=> s + b.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cSize,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...central, e.buffer], {type:'application/zip'});
}

function exportCSV(){
  if(!S.trades.length) return toast('No trades to export yet');
  const cols = ['Date','Time (SGT)','Account','Asset','Direction','PnL','Result','Tags','Notes','On plan','Rules followed','Confidence'];
  const csvEsc = v => {
    const s = String(v ?? '');

  };

  const csvText = v => {
    let s = String(v ?? '');

    return csvEsc(s);
  };
  const rows = [...S.trades]
    .sort((a,b)=> a.date===b.date ? whenTs(a)-whenTs(b) : (a.date<b.date?-1:1))
    .map(t=>{
      const p = tradePnl(t); const a = acct(t.accountId);
      const kind = classify(t);
      return [csvEsc(t.date), csvEsc(validTime(t.time)?t.time:''), csvText(a?a.name:'Deleted account'), csvText(t.asset), csvEsc(t.direction.toUpperCase()), csvEsc(p.toFixed(2)), csvEsc(kind.toUpperCase()), csvText((t.tags||[]).join('; ')), csvText(t.notes||''), csvEsc(t.onPlan||''), csvEsc(t.rulesOk||''), csvEsc(t.confidence||'')].join(',');
    });
  const csv = '\ufeff' + [cols.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tradetrackr-trades-' + todayISO() + '.csv';
  a.click(); URL.revokeObjectURL(a.href);

}


/* ============================================================
   SYNC (Neon) — one passcode, one shared copy of the journal
   ============================================================ */
const DEFAULT_SYNC_URL = 'https://br-soft-king-b3su4142-ttsync.compute.c-4.ap-southeast-1.aws.neon.tech';
const SYNC_URL = (()=>{ let u = null; try{ u = localStorage.getItem('tt_sync_url'); }catch(e){} return (u || DEFAULT_SYNC_URL).replace(/\/+$/,''); })();
const SYNC_META = 'tt_sync';
function blankMeta(){ return { key:null, rev:0, dirty:false, baseIds:[], lastSyncAt:null }; }
let SM = (()=>{ try{ const m = JSON.parse(localStorage.getItem(SYNC_META)||'null'); if(m && typeof m==='object') return Object.assign(blankMeta(), m); }catch(e){} return blankMeta(); })();
function saveMeta(){ try{ localStorage.setItem(SYNC_META, JSON.stringify(SM)); }catch(e){} }
/* status: off | ok | busy | offline | auth | error */
const SY = { status: SM.key ? 'busy' : 'off', busy:false, again:false, timer:null, msg:'' };

function ago(ts){
  const s = Math.round((Date.now()-ts)/1000);
  if(s < 45) return 'just now';
  if(s < 3600) return Math.round(s/60)+' min ago';
  if(s < 86400) return Math.round(s/3600)+' h ago';
  return fmtDateShort(new Date(ts).toISOString().slice(0,10));
}
function syncStatusInfo(){
  if(!SM.key) return { color:'var(--ink-faint)', text:'Not connected', pill:'', short:'' };
  if(SY.status==='busy') return { color:'var(--gold-1)', text:'Syncing…', pill:'busy', short:'Syncing' };
  if(SY.status==='offline') return { color:'var(--gold-1)', text:'Offline. Changes are saved here and upload when you’re back online.', pill:'warn', short:'Offline' };
  if(SY.status==='auth') return { color:'var(--red)', text:'Passcode rejected. Disconnect, then enter the passcode again.', pill:'err', short:'Passcode' };
  if(SY.status==='error') return { color:'var(--red)', text:SY.msg || 'Sync error. It will retry.', pill:'err', short:'Error' };
  if(SM.dirty) return { color:'var(--gold-1)', text:'Waiting to upload', pill:'busy', short:'Saving' };
  return { color:'var(--green)', text:'Synced' + (SM.lastSyncAt ? ' · ' + ago(SM.lastSyncAt) : ''), pill:'ok', short:'Synced' };
}
function paintSync(){
  const info = syncStatusInfo();
  const pill = document.getElementById('sync-pill');
  if(pill){
    pill.hidden = !SM.key;
    pill.className = 'sync-pill ' + info.pill;
    document.getElementById('sync-pill-txt').textContent = info.short;
  }
  const line = document.getElementById('sync-status');
  if(line) line.innerHTML = `<span class="dot" style="background:${info.color}"></span><span style="color:${info.color}">${esc(info.text)}</span>`;
}
function setSyncStatus(st, msg){ SY.status = st; SY.msg = msg||''; paintSync(); }

async function api(path, opts){
  opts = opts || {};
  const hasBody = opts.body !== undefined;
  const res = await fetch(SYNC_URL + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Authorization':'Bearer ' + (opts.key || SM.key) }, hasBody ? { 'Content-Type':'application/json' } : {}),
    body: hasBody ? JSON.stringify(opts.body) : undefined,
    cache: 'no-store'
  });
  let body = null; try{ body = await res.json(); }catch(e){}
  return { status: res.status, body };
}
/* Handle a non-OK reply. Returns false so callers can stop. */
function badResponse(r){
  if(r.status===401) setSyncStatus('auth');
  else if(r.status===429) setSyncStatus('error', 'Too many wrong passcodes. Sync is paused for 5 minutes.');
  else if(r.status===413) setSyncStatus('error', 'Your journal is too large to upload in one go.');
  else setSyncStatus('error', 'Sync service error ('+r.status+'). It will retry.');
  return false;
}
const collectIds = d => { const out = []; ['accounts','trades','missed','txns','plans','openTrades','drawings','alerts'].forEach(k=> (d[k]||[]).forEach(x=>{ if(x && x.id) out.push(k+':'+x.id); })); return out; };

/* Combine the cloud copy with this device's copy.
   Same entry on both: the most recently edited one wins.
   Only on one side: kept if it's new, dropped if it was there at the last sync (deleted on the other side). */
function mergeStates(remote, local, baseIdsArr){
  const out = normalize(JSON.parse(JSON.stringify(remote))) || blankState();
  const base = new Set(baseIdsArr||[]);
  const stamp = x => x.updatedAt || x.createdAt || 0;
  ['accounts','trades','missed','txns','plans','openTrades','drawings','alerts'].forEach(k=>{
    const r = out[k]||[], l = local[k]||[];
    const lMap = new Map(l.map(x=>[x.id,x])), rIds = new Set(r.map(x=>x.id));
    const res = [];
    r.forEach(x=>{ const lx = lMap.get(x.id); if(lx) res.push(stamp(lx) >= stamp(x) ? lx : x); else if(!base.has(k+':'+x.id)) res.push(x); });
    l.forEach(x=>{ if(!rIds.has(x.id) && !base.has(k+':'+x.id)) res.push(x); });
    out[k] = res;
  });
  const union = (a,b) => [...new Set([...(a||[]), ...(b||[])])];
  out.assets = union(out.assets, local.assets);
  out.tags = union(out.tags, local.tags);
  out.tagGroups = Object.assign({}, out.tagGroups||{}, local.tagGroups||{});
  out.settings = Object.assign({}, out.settings||{}, local.settings||{});
  /* Coach notes come from the cloud, so the cloud copy wins */
  out.briefs = (remote.briefs && remote.briefs.length) ? remote.briefs : (local.briefs||[]);
  if(out.settings.defaultAccountId && !out.accounts.some(a=>a.id===out.settings.defaultAccountId)) out.settings.defaultAccountId = out.accounts[0]?.id || null;
  return normalize(out);
}
function rerenderAfterSync(){
  if(UI.statsAccountId && !acct(UI.statsAccountId)) UI.statsAccountId = null;
  if(UI.historyFilter!=='all' && !acct(UI.historyFilter)) UI.historyFilter = 'all';
  if(UI.tab!=='add') render();
}
function applyRemote(data, rev){
  const d = normalize(data); if(!d) return;
  S = d; saveLocal();
  SM.rev = rev; SM.baseIds = collectIds(S); SM.dirty = false; SM.lastSyncAt = Date.now(); saveMeta();
  rerenderAfterSync();
}
function syncChanged(){
  if(!SM.key) return;
  SM.dirty = true; saveMeta();
  clearTimeout(SY.timer); SY.timer = setTimeout(()=>syncNow(), 900);
  paintSync();
}
async function pullState(){
  const r = await api('/?known=' + SM.rev);
  if(r.status!==200 || !r.body) return badResponse(r);
  if(r.body.unchanged){ SM.lastSyncAt = Date.now(); saveMeta(); return true; }
  const rev = Number(r.body.revision)||0;
  if(rev > SM.rev && r.body.data){ applyRemote(r.body.data, rev); return true; }
  if(rev !== SM.rev){ /* the cloud copy was reset: upload ours on top */ SM.rev = rev; SM.dirty = true; saveMeta(); return pushState(); }
  SM.lastSyncAt = Date.now(); saveMeta();
  return true;
}
async function pushState(){
  for(let attempt=0; attempt<3; attempt++){
    const sent = JSON.stringify(S);
    const r = await api('/', { method:'PUT', body:{ data: JSON.parse(sent), baseRevision: SM.rev } });
    if(r.status===200 && r.body){
      SM.rev = Number(r.body.revision)||SM.rev; SM.baseIds = collectIds(JSON.parse(sent)); SM.lastSyncAt = Date.now();
      SM.dirty = JSON.stringify(S) !== sent; /* edited again while uploading */
      saveMeta();
      if(SM.dirty) SY.again = true;
      return true;
    }
    if(r.status===409 && r.body){
      /* another device saved first: combine and try again */
      if(r.body.data){ S = mergeStates(r.body.data, S, SM.baseIds); saveLocal(); rerenderAfterSync(); }
      SM.rev = Number(r.body.revision)||0; saveMeta();
      continue;
    }
    return badResponse(r);
  }
  setSyncStatus('error', 'Couldn’t combine changes. It will retry.');
  return false;
}
async function syncNow(){
  if(!SM.key) return;
  if(SY.busy){ SY.again = true; return; }
  SY.busy = true; clearTimeout(SY.timer);
  setSyncStatus('busy');
  try{
    const ok = SM.dirty ? await pushState() : await pullState();
    if(ok) setSyncStatus('ok');
    if(ok) imgSyncSoon();
  }catch(e){
    setSyncStatus('offline');
  }finally{
    SY.busy = false;
    if(SY.again && SY.status!=='auth'){ SY.again = false; setTimeout(syncNow, 60); }
  }
}

/* ============================================================
   SCREENSHOTS — stored on the device (IndexedDB), copied to Neon
   ============================================================ */
const IMG_MAX_PER_ENTRY = 12;
let idbP = null;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise((res, rej)=>{
    const rq = indexedDB.open('tradetrackr-images', 1);
    rq.onupgradeneeded = ()=>{ const db = rq.result; db.createObjectStore('img', {keyPath:'id'}); db.createObjectStore('pending', {keyPath:'id'}); };
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror = ()=> rej(rq.error);
  });
  return idbP;
}
async function idbDo(store, mode, fn){
  const db = await idb();
  return new Promise((res, rej)=>{
    const tx = db.transaction(store, mode); let out;
    const r = fn(tx.objectStore(store)); if(r) r.onsuccess = ()=>{ out = r.result; };
    tx.oncomplete = ()=> res(out); tx.onerror = ()=> rej(tx.error); tx.onabort = ()=> rej(tx.error);
  });
}
const imgGet = id => idbDo('img','readonly', st=>st.get(id));
const imgPutRec = rec => idbDo('img','readwrite', st=>st.put(rec));
const imgDelRec = id => idbDo('img','readwrite', st=>st.delete(id));
const imgKeys = () => idbDo('img','readonly', st=>st.getAllKeys());
const pendAdd = id => idbDo('pending','readwrite', st=>st.put({id}));
const pendDel = id => idbDo('pending','readwrite', st=>st.delete(id));
const pendKeys = () => idbDo('pending','readonly', st=>st.getAllKeys());
const imgClearAll = async () => { await idbDo('img','readwrite', st=>st.clear()); await idbDo('pending','readwrite', st=>st.clear()); };

function bufToB64(buf){ const b = new Uint8Array(buf); let s = ''; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); }
function b64ToBuf(b64){ const s = atob(b64); const out = new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i); return out.buffer; }

/* Shrink to at most 1800px on the long side and re-save as JPEG (this also drops photo location data). */
async function compressImage(file){
  const MAX = 1800;
  let src = null, w = 0, h = 0, url = null;
  try{ src = await createImageBitmap(file); w = src.width; h = src.height; }
  catch(e){
    url = URL.createObjectURL(file);
    src = await new Promise((res, rej)=>{ const im = new Image(); im.onload = ()=>res(im); im.onerror = ()=>rej(new Error('decode')); im.src = url; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  try{
    if(!w || !h) throw new Error('empty');
    const k = Math.min(1, MAX/Math.max(w,h));
    const cw = Math.round(w*k), ch = Math.round(h*k);
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cw,ch); ctx.drawImage(src, 0, 0, cw, ch);
    const blob = await new Promise(res=> c.toBlob(res, 'image/jpeg', .82));
    if(!blob) throw new Error('encode');
    return { mime:'image/jpeg', buf: await blob.arrayBuffer() };
  } finally {
    if(src && src.close) src.close();
    if(url) URL.revokeObjectURL(url);
  }
}

const IMG_URLS = new Map(), IMG_DL = new Map();
async function imgDownload(id){
  if(!SM.key) return null;
  if(IMG_DL.has(id)) return IMG_DL.get(id);
  const p = (async()=>{
    try{
      const r = await api('/img/'+id);
      if(r.status!==200 || !r.body || !r.body.b64) return null;
      const rec = { id, mime:r.body.mime, buf:b64ToBuf(r.body.b64), at:Date.now() };
      await imgPutRec(rec); return rec;
    }catch(e){ return null; }
    finally{ IMG_DL.delete(id); }
  })();
  IMG_DL.set(id, p); return p;
}
async function imgURL(id){
  if(IMG_URLS.has(id)) return IMG_URLS.get(id);
  let rec = null; try{ rec = await imgGet(id); }catch(e){}
  if(!rec) rec = await imgDownload(id);
  if(!rec) return null;
  const u = URL.createObjectURL(new Blob([rec.buf], {type:rec.mime}));
  IMG_URLS.set(id, u); return u;
}

/* Delete queue: ids to remove from the cloud, kept until the delete succeeds */
const delQueue = () => { try{ return JSON.parse(localStorage.getItem('tt_img_del')||'[]'); }catch(e){ return []; } };
const setDelQueue = q => { try{ localStorage.setItem('tt_img_del', JSON.stringify(q)); }catch(e){} };
function forgetImages(ids){
  ids = (ids||[]).filter(Boolean); if(!ids.length) return;
  ids.forEach(id=>{
    imgDelRec(id).catch(()=>{}); pendDel(id).catch(()=>{});
    const u = IMG_URLS.get(id); if(u){ URL.revokeObjectURL(u); IMG_URLS.delete(id); }
  });
  if(SM.key){ const q = delQueue(); ids.forEach(id=>{ if(!q.includes(id)) q.push(id); }); setDelQueue(q); imgSyncSoon(); }
}
const referencedImages = () => { const s = new Set(); [...S.trades, ...S.missed, ...(S.plans||[]), ...(S.openTrades||[])].forEach(t=> (t.images||[]).forEach(id=>s.add(id))); return s; };

let imgSyncBusy = false, imgSyncTimer = null;
function imgSyncSoon(){ clearTimeout(imgSyncTimer); imgSyncTimer = setTimeout(imgSync, 400); }
async function imgSync(){
  if(!SM.key || imgSyncBusy) return;
  imgSyncBusy = true;
  try{
    for(const id of delQueue()){
      const r = await api('/img/'+id, {method:'DELETE'});
      if(r.status===200 || r.status===404) setDelQueue(delQueue().filter(x=>x!==id)); else break;
    }
    const refs = referencedImages();
    for(const id of await pendKeys()){
      if(!refs.has(id)) continue;
      const rec = await imgGet(id); if(!rec){ await pendDel(id); continue; }
      const r = await api('/img/'+id, {method:'PUT', body:{ mime:rec.mime, b64:bufToB64(rec.buf) }});
      if(r.status===200) await pendDel(id);
      else { if(r.status===401) setSyncStatus('auth'); break; }
    }
    /* keep recent screenshots on this device so they open offline */
    const have = new Set(await imgKeys());
    const cutoff = new Date(Date.now() - 60*86400000).toISOString().slice(0,10);
    const recent = [...(S.openTrades||[]), ...S.trades, ...S.missed, ...(S.plans||[])].filter(t=>t.date>=cutoff).sort((a,b)=> a.date<b.date?1:-1).flatMap(t=>t.images||[]).filter(id=>!have.has(id)).slice(0, 24);
    for(const id of recent) await imgDownload(id);
  }catch(e){}
  finally{ imgSyncBusy = false; if(UI.tab==='settings') paintImgCount(); }
}
async function paintImgCount(){
  const el = document.getElementById('sync-imgs'); if(!el) return;

  }catch(e){ el.textContent = ''; }

/* Remove screenshots on this device that no entry uses (e.g. a form that was never saved) */
async function gcImages(){

    if(UI.form && UI.form.images) UI.form.images.forEach(id=>keep.add(id));
    if(UI.planForm && UI.planForm.images) UI.planForm.images.forEach(id=>keep.add(id));

/* Add picked files to the open form */
async function addFormImages(files){
  const tgt = UI.imgTarget || 'before';
  const f = tgt==='plan' ? UI.planForm : UI.form; if(!f) return;
  f.images = f.images || [];

async function showViewer(){
  const id = V.ids[V.i];
  vImg.hidden = true; vImg.removeAttribute('src'); vMsg.hidden = false; vMsg.textContent = 'Loading…';
  document.getElementById('v-prev').hidden = V.i<=0;
  document.getElementById('v-next').hidden = V.i>=V.ids.length-1;
  document.getElementById('v-count').textContent = V.ids.length>1 ? (V.i+1)+' / '+V.ids.length : '';
  const u = await imgURL(id);
  if(V.ids[V.i]!==id) return;
  if(u){ vImg.src = u; vImg.hidden = false; vMsg.hidden = true; }
  else vMsg.textContent = SM.key ? 'This screenshot hasn’t reached this device yet. Try again after it syncs.' : 'This screenshot is on another device. Connect sync to see it here.';
}
function closeViewer(){
  if(!V.open) return;
  V.open = false; viewerEl.classList.remove('open');
  if(history.state && history.state.viewer){ V.closing = true; history.back(); }
}
function stepViewer(d){ const n = V.i + d; if(n>=0 && n<V.ids.length){ V.i = n; showViewer(); } }
viewerEl.addEventListener('click', e=>{
  if(e.target.closest('#v-prev')) return stepViewer(-1);
  if(e.target.closest('#v-next')) return stepViewer(1);
  closeViewer();
});
(function(){
  let x0 = null, y0 = 0;
  viewerEl.addEventListener('touchstart', e=>{ if(e.touches.length===1){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, {passive:true});
  viewerEl.addEventListener('touchend', e=>{
    if(x0===null) return; const t = e.changedTouches[0]; const dx = t.clientX-x0, dy = t.clientY-y0; x0 = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5){ e.preventDefault(); stepViewer(dx<0 ? 1 : -1); }
  });
})();

/* Thumbnails markup */
const shotThumb = (id, removable) => `<div class="shot"><img data-img="${esc(id)}" alt="Screenshot"><button class="open" data-view="${esc(id)}" aria-label="Open screenshot"></button>${removable?`<button class="rm" data-rm-img="${esc(id)}" aria-label="Remove screenshot">${I.x}</button>`:''}</div>`;
const rowThumbs = t => { const ids = t.images||[]; if(!ids.length) return ''; return `<span class="row-thumbs">${ids.slice(0,3).map(id=>`<span><img data-img="${esc(id)}" alt=""></span>`).join('')}${ids.length>3?`<em>+${ids.length-3}</em>`:''}</span>`; };

/* ============================================================
   NAV + BACK BUTTON + BOOT
   ============================================================ */
function nav(tab, fromPop){
  const changed = UI.tab !== tab;
  UI.tab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+tab).classList.add('on');
  document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('on', b.dataset.nav===tab));
  if(!fromPop && changed) history.pushState({tab}, '', '#'+tab);
  chartKey = '';
  render();
  if(!document.getElementById('view-'+tab).classList.contains('anim')) animView(document.getElementById('view-'+tab));
  if(tab!=='add' && UI.returnScroll!=null){ window.scrollTo({top:UI.returnScroll}); UI.returnScroll=null; }
  else window.scrollTo({top:0});
  if(!fromPop && tab!=='add'){ UI.reopen = null; UI.editBack = false; }
}
function render(){
  if(UI.tab==='calendar') renderCalendar();
  else if(UI.tab==='stats') renderStats();
  else if(UI.tab==='chart') renderChart();
  else if(UI.tab==='add') renderAdd();
  else if(UI.tab==='history') renderHistory();
  else if(UI.tab==='settings') renderSettings();
}
document.querySelectorAll('[data-nav]').forEach(b=> b.addEventListener('click', ()=>{
  const t = b.dataset.nav;
  if(t==='add' && (!UI.form || UI.form.editingId)){ UI.form = loadDraft() || blankForm(); UI.editBack = false; UI.reopen = null; }
  nav(t);
}));

/* Android/browser back: close open sheet first, then step back through tabs.
   Only backing out of the first screen exits the app. */
window.addEventListener('popstate', e=>{
  /* the screenshot viewer sits on its own history step */
  if(V.closing){ V.closing = false; return; }
  if(V.open){ V.open = false; viewerEl.classList.remove('open'); return; }
  /* a sheet was closed by closeSheet(): run what was waiting on it */
  if(sheetClosing){
    sheetClosing = false;
    const fn = afterSheetClose; afterSheetClose = null;
    if(fn) fn();
    return;
  }
  /* system back while a sheet is open: just close it */
  if(backdrop.classList.contains('open')){ domCloseSheet(); return; }
  const st = e.state || {};
  const tab = st.tab || 'calendar';
  if(document.getElementById('view-'+tab)) nav(tab, true);
  if(st.sheet){
    /* back onto a sheet's step: re-open that sheet, or skip the step if there's nothing to show */
    const reopen = UI.reopen; UI.reopen = null;
    if(!(reopen && reopen())) history.back();
  } else {
    UI.reopen = null;
  }
});

if('serviceWorker' in navigator){ window.addEventListener('load',()=> navigator.serviceWorker.register('sw.js').catch(()=>{})); }
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* Keyboard: Esc closes, arrows step screenshots, and on Add entry the number keys drive the calculator */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(V.open){ closeViewer(); return; }
    if(backdrop.classList.contains('open')){ closeSheet(); return; }
  }
  if(V.open){ if(e.key==='ArrowLeft') stepViewer(-1); else if(e.key==='ArrowRight') stepViewer(1); return; }
  if(UI.tab!=='add' || backdrop.classList.contains('open') || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if(t && t.closest && t.closest('input,textarea,select,[contenteditable="true"]')) return;
  if(e.key==='Enter' && t && t.closest && t.closest('button')) return;
  const map = {'+':'plus','-':'minus','Backspace':'bs','Enter':'eq','=':'eq','.':'.',',':'.','Delete':'clr'};
  const k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
  if(!k) return;
  const b = document.querySelector('#keypad [data-k="'+k+'"]');
  if(b){ e.preventDefault(); b.click(); }
});
document.getElementById('img-file').addEventListener('change', e=>{
  const files = e.target.files; if(files && files.length) addFormImages(files);
  e.target.value = '';
});
document.getElementById('sync-pill').addEventListener('click', ()=> nav('settings'));
/* re-lay out calendar and stats when crossing the tablet/desktop width */
const onWide = ()=>{ if(UI.tab==='calendar' || UI.tab==='stats') render(); };
if(WIDE.addEventListener) WIDE.addEventListener('change', onWide); else if(WIDE.addListener) WIDE.addListener(onWide);
/* sync triggers */
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') syncNow(); });
window.addEventListener('online', ()=> syncNow());
window.addEventListener('offline', ()=>{ if(SM.key) setSyncStatus('offline'); });
setInterval(()=>{ if(document.visibilityState==='visible' && SM.key && !SY.busy) syncNow(); else paintSync(); }, 45000);

history.replaceState({tab:'calendar'}, '', '#calendar');
{
  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  document.getElementById('hdr-date').textContent = DOW[now.getDay()] + ' · ' + now.getDate() + ' ' + MONTHS_S[now.getMonth()] + ' ' + now.getFullYear();
}
nav('calendar', true);
if(draftHasContent(loadDraft())) setTimeout(()=> toast('Unsaved entry kept · tap + to finish it'), 600);
paintSync();
if(SM.key) syncNow();
setTimeout(gcImages, 8000);

/* launch screen: out of the way within a second, never blocks input for long */
(function(){ const b = document.getElementById('boot'); if(!b) return;
  const done = ()=>{ b.classList.add('gone'); setTimeout(()=> b.remove(), 450); };
  setTimeout(done, window.matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 950); })();
